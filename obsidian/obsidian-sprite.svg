<?xml version="1.0" encoding="UTF-8"?>
<!-- DEPRECATED 2026-05 (AUDIT_MASCOT #4.11) — Sprite sustainable для legacy
     <use href="#obs-base"/> references, но НЕ имеет полного набора hooks
     (obs-aura/inner-star/lid/spark/edge/trail/body-x/body-wave). Все новые
     контексты hydrate'ить через ObsidianMascot.hydrate(el) — см.
     RICH_OBS_SVG в app/obsidianMascot.js. Этот файл будет удалён когда все
     <use href="#obs-base"/> места перейдут на rich-hydrate. -->
<!--
  OBSIDIAN MASCOT — SVG SPRITE
  Brand: Призма · v1.0
  
  Использование:
    <svg width="48" height="48"><use href="#obs-base" /></svg>
  
  Все символы используют viewBox="-60 -60 120 120" (квадрат 120×120 с центром в 0,0).
  Для горизонтальных движений (move/tour) используй #obs-base-h с viewBox="-60 -40 120 80".
  
  Цвета задаются через CSS-переменные --obs-body и --obs-feature.
  v22 palette refresh (см. MASCOT_OBSIDIAN.md §13.4):
  · По умолчанию (тёмная тема): body=#fff, feature=#1A1A22 (Ink — НЕ чёрный).
  · Светлая тема (override через .obs-theme-light / [data-theme="light"]):
        --obs-body: #E8E5DA;       (тёплый светло-серый, водяной знак на бумаге)
        --obs-feature: #1A1A22;    (тот же Ink что и в тёмной — single source).
  Чистый чёрный (#000, #0A0A0F и близкие) НЕ используется нигде — все
  «тёмные» элементы маскота через --obs-feature = Ink #1A1A22.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- ==================================================================== -->
    <!-- BASE — канон. Используется для всех Tier 2/3 анимаций.               -->
    <!-- ==================================================================== -->
    <symbol id="obs-base" viewBox="-60 -60 120 120">
      <!-- mM7 fix (design-03 audit) — обёртка <g class="obs-body">, чтобы
           CSS-анимации, таргетящие .obs-body (skewY/scale), работали без
           переписывания селекторов. -->
      <g class="obs-body">
        <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
        <!-- v22 visibility helper — тонкий silhouette outline. На фоне светлее
             Star (#F5F4EE) тело #E8E5DA сливается; outline 0.7 stroke с
             opacity 0.45 даёт subtle контур не нарушая «watermark» эффект.
             Монохром сохранён (тот же --obs-feature что у глаз). -->
        <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="none" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.7" opacity="0.45" stroke-linejoin="round"/>
        <polygon points="-22,-46 -32,-22 -10,46" fill="var(--obs-feature, #1A1A22)" opacity="0.08"/>
        <polygon points="6,-50 28,-22 18,32" fill="var(--obs-body, #fff)" opacity="0.04"/>
        <line x1="-22" y1="-46" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
        <line x1="6" y1="-50" x2="28" y2="-22" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.12"/>
        <line x1="28" y1="-22" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
        <line x1="6" y1="-50" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.12"/>
        <line x1="-32" y1="-22" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.08"/>
        <circle class="obs-eye-l" cx="-9" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
        <circle class="obs-eye-r" cx="6" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      </g>
      <!-- mM7 fix — particles для Living Shape (ls-streaming/stop/move/tool).
           Без них §13.6 «частицы вылетают к ответу» только в CSS. r=0
           по умолчанию, анимация проявляет их через keyframes. -->
      <circle class="obs-emit-1" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-emit-2" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-emit-3" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-emit-4" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-return-1" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-return-2" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-trail-1" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-trail-2" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-trail-3" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-particle" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
      <circle class="obs-socket" cx="0" cy="0" r="0" fill="var(--obs-feature, #1A1A22)"/>
    </symbol>

    <!-- ==================================================================== -->
    <!-- BASE-NO-EYES — кристалл без глаз. Для анимаций где глаза отдельно. -->
    <!-- ==================================================================== -->
    <symbol id="obs-shell" viewBox="-60 -60 120 120">
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
      <polygon points="-22,-46 -32,-22 -10,46" fill="var(--obs-feature, #1A1A22)" opacity="0.08"/>
      <polygon points="6,-50 28,-22 18,32" fill="var(--obs-body, #fff)" opacity="0.04"/>
      <line x1="-22" y1="-46" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
      <line x1="6" y1="-50" x2="28" y2="-22" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.12"/>
      <line x1="28" y1="-22" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
      <line x1="6" y1="-50" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.12"/>
      <line x1="-32" y1="-22" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.08"/>
    </symbol>

    <!-- ==================================================================== -->
    <!-- HORIZONTAL — для move/tour (более широкий контекст)                  -->
    <!-- ==================================================================== -->
    <symbol id="obs-base-h" viewBox="-60 -40 120 80">
      <polygon points="-22,-30 6,-34 28,-6 18,16 -10,30 -28,4 -32,-6" fill="var(--obs-body, #fff)"/>
      <polygon points="-22,-30 -32,-6 -10,30" fill="var(--obs-feature, #1A1A22)" opacity="0.08"/>
      <line x1="-22" y1="-30" x2="-10" y2="30" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.18"/>
      <line x1="6" y1="-34" x2="28" y2="-6" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.12"/>
      <line x1="28" y1="-6" x2="-10" y2="30" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.18"/>
      <circle cx="-9" cy="-1" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="6" cy="-1" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
    </symbol>

    <!-- ==================================================================== -->
    <!-- FAVICON — упрощённая версия для 12–20 px. Точки → щели.              -->
    <!-- ==================================================================== -->
    <symbol id="obs-favicon" viewBox="-60 -60 120 120">
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
      <rect x="-12" y="-4" width="6" height="2.5" fill="var(--obs-feature, #1A1A22)"/>
      <rect x="3" y="-4" width="6" height="2.5" fill="var(--obs-feature, #1A1A22)"/>
    </symbol>

    <!-- ==================================================================== -->
    <!-- STATES — отдельные глаза/веки для motion-композиций                  -->
    <!-- Используются с .obs-state-* классами для статичных состояний.         -->
    <!-- ==================================================================== -->
    
    <!-- Resting — закрытые веки -->
    <symbol id="obs-resting" viewBox="-60 -60 120 120">
      <use href="#obs-shell"/>
      <line x1="-13" y1="-3" x2="-5" y2="-3" stroke="var(--obs-feature, #1A1A22)" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="2" y1="-3" x2="10" y2="-3" stroke="var(--obs-feature, #1A1A22)" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>

    <!-- Alert — щели вместо глаз -->
    <symbol id="obs-alert" viewBox="-60 -60 120 120">
      <use href="#obs-shell"/>
      <rect x="-14" y="-3.9" width="9" height="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <rect x="2" y="-3.9" width="9" height="1.8" fill="var(--obs-feature, #1A1A22)"/>
    </symbol>

    <!-- Concerned — брови домиком + опущенные глаза -->
    <symbol id="obs-concerned" viewBox="-60 -60 120 120">
      <use href="#obs-shell"/>
      <circle cx="-8" cy="-1" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="5" cy="-1" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <line x1="-14" y1="0" x2="-5" y2="-6" stroke="var(--obs-feature, #1A1A22)" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="2" y1="-6" x2="11" y2="0" stroke="var(--obs-feature, #1A1A22)" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>

    <!-- ==================================================================== -->
    <!-- DETAIL LADDER — уровни детализации L0-L4                             -->
    <!-- ==================================================================== -->
    
    <!-- L0 — Silhouette (favicon, печать, минимум) -->
    <symbol id="obs-L0-silhouette" viewBox="-60 -60 120 120">
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
    </symbol>

    <!-- L2 — Sockets + brow (empty states, hero) -->
    <symbol id="obs-L2-sockets" viewBox="-60 -60 120 120">
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
      <polygon points="-22,-46 -32,-22 -10,46" fill="var(--obs-feature, #1A1A22)" opacity="0.10"/>
      <polygon points="6,-50 28,-22 18,32" fill="var(--obs-body, #fff)" opacity="0.06"/>
      <polygon points="-22,-46 6,-50 -8,-30" fill="var(--obs-body, #fff)" opacity="0.08"/>
      <polygon points="-32,-22 -28,12 -18,-5" fill="var(--obs-feature, #1A1A22)" opacity="0.06"/>
      <polygon points="18,32 -10,46 4,28" fill="var(--obs-feature, #1A1A22)" opacity="0.05"/>
      <line x1="-22" y1="-46" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.22"/>
      <line x1="6" y1="-50" x2="28" y2="-22" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.16"/>
      <line x1="28" y1="-22" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.22"/>
      <line x1="6" y1="-50" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.16"/>
      <line x1="-32" y1="-22" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.10"/>
      <line x1="-22" y1="-46" x2="6" y2="-50" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.10"/>
      <path d="M -16 -10 Q -7 -13 1 -11 Q 8 -10 13 -8" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" fill="none" opacity="0.18"/>
      <ellipse cx="-9" cy="-3" rx="3.2" ry="2.2" fill="var(--obs-feature, #1A1A22)" opacity="0.10"/>
      <ellipse cx="6" cy="-3" rx="3.2" ry="2.2" fill="var(--obs-feature, #1A1A22)" opacity="0.10"/>
      <circle cx="-9" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="6" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
    </symbol>

    <!-- L3 — Refractions (маркетинг, splash) -->
    <symbol id="obs-L3-refractions" viewBox="-60 -60 120 120">
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="var(--obs-body, #fff)"/>
      <polygon points="-22,-46 -32,-22 -10,46" fill="var(--obs-feature, #1A1A22)" opacity="0.12"/>
      <polygon points="6,-50 28,-22 18,32" fill="var(--obs-body, #fff)" opacity="0.08"/>
      <polygon points="-22,-46 6,-50 -8,-30" fill="var(--obs-body, #fff)" opacity="0.10"/>
      <polygon points="-32,-22 -28,12 -18,-5" fill="var(--obs-feature, #1A1A22)" opacity="0.08"/>
      <polygon points="18,32 -10,46 4,28" fill="var(--obs-feature, #1A1A22)" opacity="0.06"/>
      <polygon points="-10,-30 -2,-2 -16,-12" fill="var(--obs-body, #fff)" opacity="0.12"/>
      <polygon points="14,-15 18,32 8,8" fill="var(--obs-feature, #1A1A22)" opacity="0.06"/>
      <path d="M -20 -45 Q -8 -49 4 -49" stroke="var(--obs-body, #fff)" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round"/>
      <path d="M 8 -49 Q 16 -45 22 -38" stroke="var(--obs-body, #fff)" stroke-width="0.8" fill="none" opacity="0.35" stroke-linecap="round"/>
      <line x1="-22" y1="-46" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.25"/>
      <line x1="6" y1="-50" x2="28" y2="-22" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
      <line x1="28" y1="-22" x2="-10" y2="46" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.25"/>
      <line x1="6" y1="-50" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" opacity="0.18"/>
      <line x1="-32" y1="-22" x2="18" y2="32" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.12"/>
      <line x1="-22" y1="-46" x2="6" y2="-50" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.4" opacity="0.12"/>
      <line x1="-10" y1="-30" x2="-2" y2="-2" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.3" opacity="0.18"/>
      <line x1="14" y1="-15" x2="8" y2="8" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.3" opacity="0.14"/>
      <path d="M -16 -10 Q -7 -13 1 -11 Q 8 -10 13 -8" stroke="var(--obs-feature, #1A1A22)" stroke-width="0.5" fill="none" opacity="0.22"/>
      <ellipse cx="-9" cy="-3" rx="3.2" ry="2.2" fill="var(--obs-feature, #1A1A22)" opacity="0.12"/>
      <ellipse cx="6" cy="-3" rx="3.2" ry="2.2" fill="var(--obs-feature, #1A1A22)" opacity="0.12"/>
      <circle cx="-9" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="6" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="-9.5" cy="-3.6" r="0.5" fill="var(--obs-body, #fff)"/>
      <circle cx="5.5" cy="-3.6" r="0.5" fill="var(--obs-body, #fff)"/>
    </symbol>

    <!-- L4 — Jewel со встроенной звездой Призмы внутри ядра                  -->
    <!-- Только для key visual, печати, обложек. Никогда в интерфейсе.        -->
    <symbol id="obs-L4-jewel" viewBox="-60 -60 120 120">
      <defs>
        <linearGradient id="obs-gem-light" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--obs-body, #fff)"/>
          <stop offset="100%" stop-color="var(--obs-body, #d8d8d8)" stop-opacity="0.85"/>
        </linearGradient>
      </defs>
      <polygon points="-22,-46 6,-50 28,-22 18,32 -10,46 -28,12 -32,-22" fill="url(#obs-gem-light)"/>
      <polygon points="-22,-46 -32,-22 -10,46" fill="var(--obs-feature, #1a1a22)" opacity="0.18"/>
      <polygon points="6,-50 28,-22 18,32" fill="var(--obs-body, #fff)" opacity="0.12"/>
      <polygon points="-22,-46 6,-50 -8,-30" fill="var(--obs-body, #fff)" opacity="0.16"/>
      <polygon points="-32,-22 -28,12 -18,-5" fill="var(--obs-feature, #1a1a22)" opacity="0.12"/>
      <polygon points="18,32 -10,46 4,28" fill="var(--obs-feature, #1a1a22)" opacity="0.10"/>
      <polygon points="-10,-30 -2,-2 -16,-12" fill="var(--obs-body, #fff)" opacity="0.18"/>
      <polygon points="14,-15 18,32 8,8" fill="var(--obs-feature, #1a1a22)" opacity="0.10"/>
      <line x1="-22" y1="-46" x2="6" y2="-50" stroke="var(--obs-body, #fff)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
      <line x1="6" y1="-50" x2="28" y2="-22" stroke="var(--obs-body, #fff)" stroke-width="0.8" opacity="0.45" stroke-linecap="round"/>
      <line x1="-22" y1="-46" x2="-32" y2="-22" stroke="var(--obs-body, #fff)" stroke-width="0.5" opacity="0.25" stroke-linecap="round"/>
      <line x1="18" y1="32" x2="-10" y2="46" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.6" opacity="0.4"/>
      <line x1="28" y1="-22" x2="18" y2="32" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.5" opacity="0.3"/>
      <line x1="-22" y1="-46" x2="-10" y2="46" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.4" opacity="0.3"/>
      <line x1="-10" y1="-30" x2="-2" y2="-2" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.3" opacity="0.22"/>
      <line x1="14" y1="-15" x2="8" y2="8" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.3" opacity="0.18"/>
      <path d="M -8 -42 Q 0 -46 8 -45 Q 14 -42 16 -36" stroke="var(--obs-body, #fff)" stroke-width="1.6" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 14 -28 Q 18 -22 18 -16" stroke="var(--obs-body, #fff)" stroke-width="0.5" fill="none" opacity="0.35" stroke-linecap="round"/>
      <!-- Embedded 8-ray Prisma star inside core -->
      <g opacity="0.20">
        <polygon points="0,-12 1.6,-1.6 0,0 -1.6,-1.6" fill="var(--obs-feature, #1a1a22)"/>
        <polygon points="0,12 1.6,1.6 0,0 -1.6,1.6" fill="var(--obs-feature, #1a1a22)"/>
        <polygon points="-12,0 -1.6,-1.6 0,0 -1.6,1.6" fill="var(--obs-feature, #1a1a22)"/>
        <polygon points="12,0 1.6,-1.6 0,0 1.6,1.6" fill="var(--obs-feature, #1a1a22)"/>
      </g>
      <path d="M -16 -10 Q -7 -13 1 -11 Q 8 -10 13 -8" stroke="var(--obs-feature, #1a1a22)" stroke-width="0.6" fill="none" opacity="0.3"/>
      <ellipse cx="-9" cy="-3" rx="3.4" ry="2.4" fill="var(--obs-feature, #1a1a22)" opacity="0.18"/>
      <ellipse cx="6" cy="-3" rx="3.4" ry="2.4" fill="var(--obs-feature, #1a1a22)" opacity="0.18"/>
      <circle cx="-9" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="6" cy="-3" r="1.8" fill="var(--obs-feature, #1A1A22)"/>
      <circle cx="-9.5" cy="-3.6" r="0.5" fill="var(--obs-body, #fff)"/>
      <circle cx="5.5" cy="-3.6" r="0.5" fill="var(--obs-body, #fff)"/>
    </symbol>
  </defs>
</svg>

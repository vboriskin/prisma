<?xml version="1.0" encoding="UTF-8"?>
<!--
  СБОФ Планирование favicon (V18.1).
  Mini-Gantt cascade: three staggered task bars on accent surface.
  Semantics: dependent tasks across release windows 1.20 / 1.21 / 1.22.
  Each row offset right of the previous → readable as Gantt with deps,
  not as a flat burn-down. Solid fills only, no gradients, no animations.
  Foreground white, surface accent #4f46e5, container squircle rx=6.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#4f46e5"/>
  <rect x="6"  y="8"  width="14" height="4" rx="1.5" fill="#ffffff"/>
  <rect x="12" y="14" width="14" height="4" rx="1.5" fill="#ffffff"/>
  <rect x="8"  y="20" width="11" height="4" rx="1.5" fill="#ffffff"/>
</svg>

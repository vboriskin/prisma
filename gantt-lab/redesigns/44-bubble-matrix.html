<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 44 · Пузырьковая матрица</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .sub { font: 500 12px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .top .spacer { flex: 1; }
  .top .legend { display: flex; gap: 14px; font-size: 11px; color: var(--prizma-text-tertiary); align-items: center; }
  .top .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  .eyebrowbar { padding: 9px 22px 0; flex: none; }

  /* ── layout ── */
  .body { flex: 1; display: flex; min-height: 0; }
  .plotwrap { flex: 1; position: relative; min-height: 0; padding: 6px 18px 14px; }
  svg.plot { width: 100%; height: 100%; display: block; }

  /* SVG-текст наследует семейство; tnum для чисел */
  svg text { font-family: var(--font); }
  .axlab { font-size: 11px; font-weight: 600; fill: var(--prizma-text-secondary); }
  .axsub { font-size: 9.5px; font-family: var(--mono); fill: var(--prizma-text-tertiary); letter-spacing: .3px; }
  .axtitle { font-size: 10px; font-weight: 700; letter-spacing: .6px; fill: var(--prizma-text-tertiary); text-transform: uppercase; }
  .gl { stroke: var(--prizma-border); stroke-width: 1; }
  .gl-strong { stroke: var(--prizma-border-strong); stroke-width: 1; }
  .gl-today { stroke: var(--prizma-information); stroke-width: 1; stroke-dasharray: 3 3; }
  .rowband { fill: color-mix(in srgb, var(--prizma-text-primary) 2.5%, transparent); }

  .bub { cursor: pointer; transition: opacity .14s var(--ease-calm); }
  .bub circle.dot { transition: stroke-width .12s, r .18s var(--ease-spring); }
  .bub .ring { fill: none; opacity: 0; transition: opacity .12s; }
  .bub:hover .ring { opacity: .9; }
  .plot.dimmed .bub:not(.hot) { opacity: .26; }

  .hotzone { fill: none; stroke: var(--prizma-off-course); stroke-width: 1; stroke-dasharray: 4 4; opacity: .5; rx: 12; }
  .hotlab { font-size: 9.5px; font-weight: 700; letter-spacing: .4px; fill: var(--prizma-off-course); text-transform: uppercase; }

  /* ── легенда размеров ── */
  .sizekey { flex: none; width: 188px; border-left: 1px solid var(--prizma-border); padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .sizekey .pz-eyebrow { display: block; margin-bottom: 10px; }
  .skrow { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
  .skrow .sw { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; }
  .skrow .sw svg { overflow: visible; }
  .skrow .tx { font-size: 11.5px; color: var(--prizma-text-secondary); }
  .skrow .tx b { color: var(--prizma-text-primary); font: 600 12px/1 var(--mono); }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--prizma-text-secondary); margin-bottom: 9px; }
  .stat i { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  .sknote { font-size: 10.5px; line-height: 1.5; color: var(--prizma-text-tertiary); }
  .skdiv { height: 1px; background: var(--prizma-border); margin: 2px 0; }

  /* ── label card (hover) ── */
  .tip { position: fixed; z-index: var(--z-dropdown); min-width: 210px; max-width: 290px; background: var(--prizma-bg-elevated); border: 1px solid var(--prizma-border-strong); border-radius: var(--r-md); box-shadow: 0 12px 36px rgba(0,0,0,.5); padding: 11px 13px; opacity: 0; transform: translateY(4px); transition: opacity .14s var(--ease-calm), transform .14s var(--ease-calm); pointer-events: none; overflow: hidden; }
  .tip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--prizma-information)); }
  .tip.show { opacity: 1; transform: translateY(0); }
  .tip .tt { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; padding-left: 2px; }
  .tip .tr { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--prizma-text-secondary); margin-bottom: 4px; padding-left: 2px; }
  .tip .tr .v { font: 600 11px/1 var(--mono); color: var(--prizma-text-primary); }
  .tip .pz-eyebrow { display: block; margin: 9px 0 6px; padding-left: 2px; }
  .tip .pl-list { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 2px; }
  .tip .pl { position: relative; font: 600 10px/1 var(--mono); padding: 4px 7px 4px 9px; border-radius: var(--r-sm); background: var(--prizma-bg-tertiary); color: var(--prizma-text-secondary); overflow: hidden; }
  .tip .pl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--wt); }
  .tip .pl.done { opacity: .55; text-decoration: line-through; text-decoration-color: var(--prizma-text-tertiary); }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Пузырьковая матрица</span>
    <span class="sub">эпики · окно × риск</span>
    <span class="spacer"></span>
    <span class="legend">
      <span><i style="background:var(--prizma-on-course)"></i>по курсу</span>
      <span><i style="background:var(--prizma-drift)"></i>дрейф</span>
      <span><i style="background:var(--prizma-off-course)"></i>срыв</span>
    </span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>
  <div class="eyebrowbar"><span class="pz-eyebrow">Редизайн 44 · scatter</span></div>
  <div class="body">
    <div class="plotwrap" id="plotwrap">
      <svg class="plot" id="plot" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Пузырьковая матрица эпиков"></svg>
    </div>
    <aside class="sizekey">
      <div>
        <span class="pz-eyebrow">Размер = эффорт</span>
        <div class="skrow"><span class="sw"><svg width="44" height="20" viewBox="0 0 44 20"><circle cx="22" cy="10" r="5" fill="none" stroke="var(--prizma-text-secondary)" stroke-width="1.4"/></svg></span><span class="tx"><b>~18</b> чел-дн</span></div>
        <div class="skrow"><span class="sw"><svg width="44" height="30" viewBox="0 0 44 30"><circle cx="22" cy="15" r="10" fill="none" stroke="var(--prizma-text-secondary)" stroke-width="1.4"/></svg></span><span class="tx"><b>~36</b> чел-дн</span></div>
        <div class="skrow"><span class="sw"><svg width="44" height="40" viewBox="0 0 44 40"><circle cx="22" cy="20" r="15" fill="none" stroke="var(--prizma-text-secondary)" stroke-width="1.4"/></svg></span><span class="tx"><b>60+</b> чел-дн</span></div>
      </div>
      <div class="skdiv"></div>
      <div>
        <span class="pz-eyebrow">Цвет = статус</span>
        <div class="stat"><i style="background:var(--prizma-on-course)"></i>По курсу</div>
        <div class="stat"><i style="background:var(--prizma-drift)"></i>Дрейф</div>
        <div class="stat"><i style="background:var(--prizma-off-course)"></i>Срыв</div>
      </div>
      <div class="skdiv"></div>
      <div class="sknote">По X — доминирующее окно эпика, по Y — уровень риска. Правый-верхний угол: что <b style="color:var(--prizma-text-secondary)">крупное и рискованное</b> — туда смотреть первым.</div>
    </aside>
  </div>
  <div class="tip" id="tip"></div>

<script>
(function () {
  const D = window.PZ_DATA, H = D.helpers, cols = D.releases;
  const plot = document.getElementById('plot');
  const wrap = document.getElementById('plotwrap');
  const tip = document.getElementById('tip');
  const wtVar = wt => (D.WT[wt] && D.WT[wt].color) || 'var(--prizma-information)';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SVGNS = 'http://www.w3.org/2000/svg';

  // ── доминирующее окно эпика (где больше всего пилюль) ──
  function dominantCol(e) {
    const tally = {};
    e.pills.forEach(p => { tally[p.col] = (tally[p.col] || 0) + 1; });
    let best = e.pills[0] ? e.pills[0].col : 'backlog', n = -1;
    cols.forEach(c => { if ((tally[c.key] || 0) > n) { n = tally[c.key] || 0; best = c.key; } });
    return best;
  }
  // Y-уровень риска (0 = срыв сверху, 2 = по курсу снизу).
  const RISK_Y = { 'off-course': 0, 'drift': 1, '': 2, null: 2 };
  const riskKey = e => (e.risk || '');
  const riskColor = e => e.risk === 'off-course' ? 'var(--prizma-off-course)' : e.risk === 'drift' ? 'var(--prizma-drift)' : 'var(--prizma-on-course)';
  const riskWord = e => e.risk === 'off-course' ? 'срыв' : e.risk === 'drift' ? 'дрейф' : 'по курсу';

  const Y_ROWS = [
    { key: 'off-course', label: 'Срыв', color: 'var(--prizma-off-course)' },
    { key: 'drift', label: 'Дрейф', color: 'var(--prizma-drift)' },
    { key: '', label: 'По курсу', color: 'var(--prizma-on-course)' },
  ];

  // эффорт → радиус (sqrt-шкала, чтобы площадь ∝ эффорту)
  const efforts = D.epics.map(H.effortOf);
  const maxEff = Math.max.apply(null, efforts.concat([1]));
  const R_MIN = 8, R_MAX = 30;
  const rOf = eff => {
    const t = Math.sqrt(Math.max(eff, 0) / maxEff); // 0..1
    return R_MIN + t * (R_MAX - R_MIN);
  };

  // детерминированный «джиттер» (без рандома → стабильно между рендерами)
  function jitter(seed, amp) {
    const x = Math.sin(seed * 12.9898 + 4.1) * 43758.5453;
    return ((x - Math.floor(x)) - 0.5) * 2 * amp; // -amp..amp
  }

  let nodes = [];   // {e, cx, cy, r, col, risk}
  let layout = null;

  function buildLayout(W, Hh) {
    const PAD = { l: 64, r: 22, t: 30, b: 46 };
    const plotW = W - PAD.l - PAD.r;
    const plotH = Hh - PAD.t - PAD.b;
    const nx = cols.length;
    const colW = plotW / nx;
    const xCenter = i => PAD.l + colW * (i + 0.5);
    const rowH = plotH / Y_ROWS.length;
    const yCenter = ri => PAD.t + rowH * (ri + 0.5);
    return { PAD, plotW, plotH, colW, rowH, xCenter, yCenter, W, Hh, nx };
  }

  function computeNodes(L) {
    nodes = [];
    const byCell = {}; // "colIdx|riskIdx" → count, для разведения
    D.epics.forEach(e => {
      const colKey = dominantCol(e);
      const ci = Math.max(0, cols.findIndex(c => c.key === colKey));
      const ri = Y_ROWS.findIndex(r => r.key === riskKey(e));
      const cellKey = ci + '|' + ri;
      const idx = (byCell[cellKey] = (byCell[cellKey] || 0) + 1) - 1;
      const r = rOf(H.effortOf(e));
      // джиттер пропорционален размеру ячейки, плюс смещение по индексу внутри ячейки
      const seed = e.id.split('').reduce((a, c) => a + c.charCodeAt(0), idx * 7);
      const jx = jitter(seed, L.colW * 0.22) + (idx ? jitter(seed + 1, L.colW * 0.16) : 0);
      const jy = jitter(seed + 3, L.rowH * 0.24);
      let cx = L.xCenter(ci) + jx;
      let cy = L.yCenter(ri) + jy;
      // кламп внутрь поля
      cx = Math.max(L.PAD.l + r, Math.min(cx, L.W - L.PAD.r - r));
      cy = Math.max(L.PAD.t + r, Math.min(cy, L.Hh - L.PAD.b - r));
      nodes.push({ e, cx, cy, r, ci, ri, colKey, eff: H.effortOf(e) });
    });
  }

  function render() {
    const rect = wrap.getBoundingClientRect();
    const W = Math.max(640, Math.round(rect.width - 36));
    const Hh = Math.max(360, Math.round(rect.height - 20));
    if (!W || !Hh) return;
    plot.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
    L = buildLayout(W, Hh);
    layout = L;
    computeNodes(L);

    const f = [];
    // строки-зебра (нейтральные)
    Y_ROWS.forEach((row, ri) => {
      if (ri % 2 === 0) {
        const y = L.PAD.t + L.rowH * ri;
        f.push('<rect class="rowband" x="' + L.PAD.l + '" y="' + y.toFixed(1) + '" width="' + L.plotW.toFixed(1) + '" height="' + L.rowH.toFixed(1) + '"/>');
      }
    });
    // горизонтальные разделители рядов + Y-подписи
    Y_ROWS.forEach((row, ri) => {
      const yTop = L.PAD.t + L.rowH * ri;
      f.push('<line class="gl" x1="' + L.PAD.l + '" y1="' + yTop.toFixed(1) + '" x2="' + (L.W - L.PAD.r).toFixed(1) + '" y2="' + yTop.toFixed(1) + '"/>');
      const yc = L.yCenter(ri);
      f.push('<circle cx="' + (L.PAD.l - 40) + '" cy="' + (yc - 4).toFixed(1) + '" r="3.5" fill="' + row.color + '"/>');
      f.push('<text class="axlab" x="' + (L.PAD.l - 30) + '" y="' + (yc - 1).toFixed(1) + '">' + row.label + '</text>');
    });
    // нижняя граница поля
    const yBot = L.PAD.t + L.plotH;
    f.push('<line class="gl-strong" x1="' + L.PAD.l + '" y1="' + yBot.toFixed(1) + '" x2="' + (L.W - L.PAD.r).toFixed(1) + '" y2="' + yBot.toFixed(1) + '"/>');
    f.push('<line class="gl-strong" x1="' + L.PAD.l + '" y1="' + L.PAD.t + '" x2="' + L.PAD.l + '" y2="' + yBot.toFixed(1) + '"/>');

    // вертикальные разделители окон + X-подписи
    cols.forEach((c, ci) => {
      if (ci > 0) {
        const x = L.PAD.l + L.colW * ci;
        f.push('<line class="gl" x1="' + x.toFixed(1) + '" y1="' + L.PAD.t + '" x2="' + x.toFixed(1) + '" y2="' + yBot.toFixed(1) + '"/>');
      }
      const xc = L.xCenter(ci);
      const isCur = !!c.current;
      f.push('<text class="axlab" text-anchor="middle" x="' + xc.toFixed(1) + '" y="' + (yBot + 20).toFixed(1) + '"' + (isCur ? ' fill="var(--prizma-text-primary)"' : '') + '>' + esc(c.short) + (isCur ? ' · тек.' : '') + '</text>');
      const dt = c.dated ? new Date(c.start + 'T00:00:00').toLocaleDateString('ru', { day: '2-digit', month: 'short' }) : 'без даты';
      f.push('<text class="axsub" text-anchor="middle" x="' + xc.toFixed(1) + '" y="' + (yBot + 34).toFixed(1) + '">' + dt + '</text>');
    });

    // сегодня-линия внутри текущего окна
    const curIdx = cols.findIndex(c => c.current);
    if (curIdx >= 0 && cols[curIdx].dated) {
      const c = cols[curIdx];
      const s = new Date(c.start + 'T00:00:00'), en = new Date(c.end + 'T00:00:00'), td = new Date(D.today + 'T00:00:00');
      const span = en - s;
      const frac = span > 0 ? Math.max(0, Math.min(1, (td - s) / span)) : 0.5;
      if (!isNaN(frac)) {
        const x = L.PAD.l + L.colW * curIdx + L.colW * frac;
        f.push('<line class="gl-today" x1="' + x.toFixed(1) + '" y1="' + L.PAD.t + '" x2="' + x.toFixed(1) + '" y2="' + yBot.toFixed(1) + '"/>');
        f.push('<rect x="' + (x - 22).toFixed(1) + '" y="' + (L.PAD.t - 14) + '" width="44" height="13" fill="var(--prizma-bg)"/>');
        f.push('<text x="' + x.toFixed(1) + '" y="' + (L.PAD.t - 4) + '" text-anchor="middle" font-family="var(--mono)" font-size="8.5" font-weight="700" fill="var(--prizma-information)">СЕГОДНЯ</text>');
      }
    }

    // осевые заголовки
    f.push('<text class="axtitle" text-anchor="middle" x="' + (L.PAD.l + L.plotW / 2).toFixed(1) + '" y="' + (L.Hh - 6) + '">Окно релиза</text>');
    f.push('<text class="axtitle" transform="translate(14,' + (L.PAD.t + L.plotH / 2).toFixed(1) + ') rotate(-90)" text-anchor="middle">Уровень риска</text>');

    // hot-zone: правый-верхний (последние датированные окна × срыв/дрейф)
    const hzX = L.PAD.l + L.colW * 2;        // от 1.21 вправо
    const hzW = L.W - L.PAD.r - hzX;
    const hzY = L.PAD.t;
    const hzH = L.rowH * 2;                   // срыв + дрейф
    f.push('<rect class="hotzone" x="' + hzX.toFixed(1) + '" y="' + hzY.toFixed(1) + '" width="' + hzW.toFixed(1) + '" height="' + hzH.toFixed(1) + '" rx="12"/>');
    f.push('<text class="hotlab" text-anchor="end" x="' + (L.W - L.PAD.r - 8).toFixed(1) + '" y="' + (hzY + 14).toFixed(1) + '">крупное · рискованное</text>');

    // пузырьки
    nodes.forEach(n => {
      const col = riskColor(n.e);
      const hot = n.e.risk && n.ci >= 2; // в hot-zone
      f.push('<g class="bub' + (hot ? ' hot' : '') + '" data-id="' + n.e.id + '">' +
        '<circle class="ring" cx="' + n.cx.toFixed(1) + '" cy="' + n.cy.toFixed(1) + '" r="' + (n.r + 4).toFixed(1) + '" stroke="' + col + '" stroke-width="1.4"/>' +
        '<circle class="dot" cx="' + n.cx.toFixed(1) + '" cy="' + n.cy.toFixed(1) + '" r="' + n.r.toFixed(1) + '" fill="' + col + '" fill-opacity="0.16" stroke="' + col + '" stroke-width="1.6"/>' +
        '<text text-anchor="middle" x="' + n.cx.toFixed(1) + '" y="' + (n.cy + 3.5).toFixed(1) + '" font-family="var(--mono)" font-size="9" font-weight="700" fill="var(--prizma-text-primary)" pointer-events="none">' + n.eff + '</text>' +
        '</g>');
    });

    plot.innerHTML = f.join('');
    wire();
  }

  // ── tooltip / hover ──
  let tipNode = null;
  function buildTip(e) {
    const col = riskColor(e);
    let h = '<div class="tt">' + esc(e.epic) + '</div>';
    h += '<div class="tr"><span>Команда</span><span class="v">' + esc(e.team) + '</span></div>';
    h += '<div class="tr"><span>Окно</span><span class="v">' + esc((cols.find(c => c.key === dominantCol(e)) || {}).short || '—') + '</span></div>';
    h += '<div class="tr"><span>Эффорт</span><span class="v">' + H.effortOf(e) + ' чел-дн</span></div>';
    h += '<div class="tr"><span>Готовность</span><span class="v">' + Math.round(H.doneRatio(e) * 100) + '%</span></div>';
    h += '<div class="tr"><span>Статус</span><span class="v" style="color:' + col + '">' + riskWord(e) + '</span></div>';
    if (e.moves) h += '<div class="tr"><span>Переносов</span><span class="v">' + e.moves + '</span></div>';
    h += '<span class="pz-eyebrow">Работы · ' + e.pills.length + '</span><div class="pl-list">';
    e.pills.forEach(p => {
      h += '<span class="pl' + (p.state === 'done' ? ' done' : '') + '" style="--wt:' + wtVar(p.wt) + '">' + esc(p.wt) + '</span>';
    });
    h += '</div>';
    return h;
  }
  function positionTip(cx, cy) {
    // cx/cy в координатах SVG → экранные
    const svgRect = plot.getBoundingClientRect();
    const vb = plot.viewBox.baseVal;
    const sx = svgRect.left + (cx / vb.width) * svgRect.width;
    const sy = svgRect.top + (cy / vb.height) * svgRect.height;
    tip.style.visibility = 'hidden'; tip.classList.add('show');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = sx + 16;
    let top = sy - th / 2;
    if (left + tw > window.innerWidth - 10) left = sx - tw - 16;
    top = Math.max(10, Math.min(top, window.innerHeight - th - 10));
    tip.style.left = left.toFixed(0) + 'px';
    tip.style.top = top.toFixed(0) + 'px';
    tip.style.visibility = '';
  }
  function wire() {
    const byId = {}; D.epics.forEach(e => byId[e.id] = e);
    plot.querySelectorAll('.bub').forEach(g => {
      const n = nodes.find(x => x.e.id === g.dataset.id);
      g.addEventListener('mouseenter', () => {
        tipNode = g;
        const e = byId[g.dataset.id];
        tip.style.setProperty('--accent', riskColor(e));
        tip.innerHTML = buildTip(e);
        plot.classList.add('dimmed');
        g.classList.add('hot');
        if (n) positionTip(n.cx, n.cy);
      });
      g.addEventListener('mouseleave', () => {
        if (tipNode === g) { tip.classList.remove('show'); tipNode = null; }
        plot.classList.remove('dimmed');
        if (!(n && n.e.risk && n.ci >= 2)) g.classList.remove('hot');
      });
    });
  }

  let L = null;
  // sync + setTimeout + resize (gotcha a)
  render();
  setTimeout(render, 60);
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 80); });

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement;
    r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>

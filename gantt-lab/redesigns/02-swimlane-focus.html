<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 02 · Фокус-дорожка</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .sub { font: 500 12px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .top .spacer { flex: 1; }
  .top .legend { display: flex; gap: 14px; font-size: 11px; color: var(--prizma-text-tertiary); }
  .top .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  /* ── корпус: left rail + main ── */
  .body { flex: 1; display: flex; min-height: 0; }

  /* left rail — список команд + сводка */
  .rail { width: 248px; flex: none; border-right: 1px solid var(--prizma-border); overflow-y: auto; padding: 10px 0; }
  .rail .lbl { padding: 4px 18px 8px; }
  .railTeam { position: relative; display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 11px 18px 11px 21px; border-bottom: 1px solid var(--prizma-border); transition: background .15s; }
  .railTeam:hover { background: var(--prizma-bg-elevated); }
  .railTeam::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: background .2s var(--ease-calm); }
  .railTeam.active::before { background: var(--prizma-text-primary); }
  .railTeam.active { background: var(--prizma-bg-elevated); }
  .railTeam .nm { font-size: 13px; font-weight: 600; color: var(--prizma-text-primary); display: flex; align-items: center; gap: 7px; }
  .railTeam .nm .rdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .railTeam .meta { font: 500 10.5px/1.3 var(--mono); color: var(--prizma-text-tertiary); margin-top: 5px; }
  /* мини-полоска нагрузки в rail */
  .railLoad { display: flex; gap: 3px; margin-top: 8px; }
  .railLoad .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--prizma-bg-tertiary); position: relative; overflow: hidden; }
  .railLoad .seg i { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--prizma-text-secondary); }
  .railLoad .seg.over i { background: var(--load); }

  /* main surface */
  .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .mhead { display: flex; align-items: baseline; gap: 12px; padding: 10px 22px 8px; flex: none; }
  .mhead .pz-eyebrow { color: var(--prizma-text-tertiary); }
  .mhead .note { font-size: 11.5px; color: var(--prizma-text-tertiary); }

  .scroll { flex: 1; overflow: auto; min-height: 0; }
  .grid { display: grid; grid-template-columns: 240px repeat(5, minmax(132px, 1fr)); min-width: 940px; position: relative; }

  /* header релизов — нейтральный */
  .h { position: sticky; top: 0; z-index: 10; background: var(--prizma-bg); padding: 14px 14px 11px; border-bottom: 1px solid var(--prizma-border); }
  .h .rel { font: 300 18px/1 var(--mono); color: var(--prizma-text-secondary); }
  .h .rel.cur { color: var(--prizma-text-primary); }
  .h .dt { display: block; margin-top: 5px; font-size: 10px; color: var(--prizma-text-tertiary); }
  .h.first { display: flex; align-items: flex-end; }
  .h.first .pz-eyebrow { color: var(--prizma-text-tertiary); }

  /* ── collapsed-команда: одна сводная строка ── */
  .sumrow { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; cursor: pointer; border-bottom: 1px solid var(--prizma-border); transition: background .15s; }
  .sumrow:hover { background: var(--prizma-bg-elevated); }
  .sumrow .scol { border-left: 1px solid var(--prizma-border); padding: 12px 12px; display: flex; flex-direction: column; gap: 7px; justify-content: center; }
  .sumrow .slabel { position: sticky; left: 0; z-index: 2; background: var(--prizma-bg); border-left: none; padding: 12px 16px; flex-direction: row; align-items: center; gap: 9px; }
  .sumrow:hover .slabel { background: var(--prizma-bg-elevated); }
  .sumrow .slabel .chev { color: var(--prizma-text-tertiary); flex: none; transition: transform .2s; }
  .sumrow .slabel .tn { font-size: 13px; font-weight: 600; }
  .sumrow .slabel .tc { font: 600 10.5px/1 var(--mono); color: var(--prizma-text-tertiary); margin-left: auto; }
  .sumrow .slabel .rdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  /* нагрузка в ячейке: точки = кол-во пилюль; тинт только при перегрузе drift/off-course */
  .dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 8px; }
  .dots .d { width: 7px; height: 7px; border-radius: 50%; background: var(--prizma-text-secondary); opacity: .6; }
  .dots.over .d { background: var(--load); opacity: 1; }
  .scnt { font: 500 9.5px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .scnt.over { color: var(--load); }

  /* ── expanded-команда: заголовок-полоса + детальные строки ── */
  .teamhdr { grid-column: 1 / -1; position: sticky; left: 0; display: flex; align-items: center; gap: 9px;
    padding: 10px 16px 8px; background: var(--prizma-bg); cursor: pointer; }
  .teamhdr::before { content: ""; width: 3px; align-self: stretch; background: var(--prizma-text-primary); border-radius: 2px; margin-right: 3px; }
  .teamhdr .chev { color: var(--prizma-text-secondary); transform: rotate(90deg); flex: none; }
  .teamhdr .tn { font: 700 11px/1 var(--font); letter-spacing: .5px; text-transform: uppercase; }
  .teamhdr .tc { font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); }

  .lbl { position: sticky; left: 0; z-index: 2; background: var(--prizma-bg); padding: 10px 14px; border-bottom: 1px solid var(--prizma-border); }
  .lbl .nm { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .lbl .nm .risk { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .lbl .est { font: 500 10.5px/1 var(--mono); color: var(--prizma-text-tertiary); margin-top: 4px; }

  .c { border-bottom: 1px solid var(--prizma-border); border-left: 1px solid var(--prizma-border); padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; align-content: flex-start; }
  .c.bz { background: color-mix(in srgb, var(--prizma-text-primary) 2%, transparent); }

  /* пилюли в раскрытой команде — полные, work-type stripe */
  .pill { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px 5px 11px; font: 600 11.5px/1 var(--font); color: var(--prizma-text-primary); background: var(--prizma-bg-tertiary); border-radius: var(--r-sm); }
  .pill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--wt); border-radius: var(--r-sm) 0 0 var(--r-sm); }
  .pill .who { font: 500 9.5px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .pill[data-state="done"] { opacity: .62; }
  .pill[data-state="done"] .nm { text-decoration: line-through; text-decoration-color: var(--prizma-text-tertiary); }
  .pill[data-state="progress"]::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--prizma-text-secondary); }
  .pill[data-state="unplanned"] { background: transparent; box-shadow: inset 0 0 0 1px var(--prizma-border); }

  /* анимация раскрытия: детальные строки — прямые grid-дети (колонки совпадают),
     появление через opacity+slide по классу .enter (надёжнее subgrid-fold) */
  .lbl, .c { animation: fadeUp .42s var(--ease-calm) both; }
  .teamhdr { animation: fadeUp .3s var(--ease-calm) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  /* схлопывание перед сменой фокуса */
  .grid.leaving .lbl, .grid.leaving .c, .grid.leaving .teamhdr { opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; animation: none; }

  /* today-axis */
  .today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--prizma-information); opacity: .85; pointer-events: none; z-index: 5; }
  .today .cap { position: absolute; top: 6px; left: -1px; transform: translateX(-50%); font: 700 9px/1 var(--mono); letter-spacing: .4px; color: var(--prizma-information); background: var(--prizma-bg); padding: 2px 5px; border-radius: 0 0 3px 3px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Фокус-дорожка</span>
    <span class="sub">одно крупно · остальное тихо</span>
    <span class="spacer"></span>
    <span class="legend"><span><i style="background:var(--prizma-drift)"></i>дрейф</span><span><i style="background:var(--prizma-off-course)"></i>риск срыва</span><span><i style="background:var(--prizma-information)"></i>сегодня</span></span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Переключить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>

  <div class="body">
    <aside class="rail" id="rail"></aside>
    <div class="main">
      <div class="mhead">
        <span class="pz-eyebrow">Редизайн 02 · Progressive disclosure</span>
        <span class="note">Одна команда раскрыта детально, остальные свёрнуты в тихую сводку нагрузки. Клик по команде меняет фокус.</span>
      </div>
      <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
    </div>
  </div>

<script>
(function () {
  const D = window.PZ_DATA, cols = D.releases;
  const grid = document.getElementById('grid');
  const rail = document.getElementById('rail');
  const scroll = document.getElementById('scroll');

  const wtVar = wt => ({BE:'--wt-be',FE:'--wt-fe',QA:'--wt-qa',AN:'--wt-an',BA:'--wt-ba',IMPL:'--wt-impl',MIG:'--wt-mig',STAB:'--wt-stab',HF:'--wt-hf'}[wt] || '--prizma-information');
  const riskVar = r => r === 'off-course' ? 'var(--prizma-off-course)' : r === 'drift' ? 'var(--prizma-drift)' : '';
  const fmtSpan = c => c.dated ? new Date(c.start).toLocaleDateString('ru', { day: '2-digit', month: 'short' }) + ' – ' + new Date(c.end).toLocaleDateString('ru', { day: '2-digit', month: 'short' }) : 'без даты';
  const OVERLOAD = 3; // порог перегруза для тинта сводки

  // высший риск команды
  function teamRisk(team) {
    const eps = D.helpers.teamEpics(team);
    if (eps.some(e => e.risk === 'off-course')) return 'off-course';
    if (eps.some(e => e.risk === 'drift')) return 'drift';
    return null;
  }
  function teamMaxLoad(team) {
    return Math.max(...cols.map(c => D.helpers.loadByTeamRelease(team, c.key)));
  }

  let focus = D.teams[0]; // активная команда

  // ── left rail ──
  function renderRail() {
    let h = '<div class="lbl pz-eyebrow">Команды · ' + D.teams.length + '</div>';
    D.teams.forEach(team => {
      const eps = D.helpers.teamEpics(team);
      const work = eps.reduce((n, e) => n + e.pills.length, 0);
      const risk = teamRisk(team);
      const rdot = risk ? '<span class="rdot" style="background:' + riskVar(risk) + '"></span>' : '';
      const maxL = teamMaxLoad(team) || 1;
      // мини-полоски по релизам
      const segs = cols.map(c => {
        const l = D.helpers.loadByTeamRelease(team, c.key);
        const over = l >= OVERLOAD && risk;
        const pct = Math.round((l / maxL) * 100);
        const loadColor = risk === 'off-course' ? 'var(--prizma-off-course)' : 'var(--prizma-drift)';
        return '<span class="seg' + (over ? ' over' : '') + '" style="--load:' + loadColor + '" title="' + c.short + ': ' + l + '"><i style="height:' + pct + '%"></i></span>';
      }).join('');
      h += '<button class="railTeam' + (team === focus ? ' active' : '') + '" data-team="' + team + '">' +
        '<span class="nm">' + rdot + team + '</span>' +
        '<span class="meta">' + eps.length + ' эпиков · ' + work + ' работ</span>' +
        '<span class="railLoad">' + segs + '</span>' +
        '</button>';
    });
    rail.innerHTML = h;
    rail.querySelectorAll('.railTeam').forEach(b => b.addEventListener('click', () => setFocus(b.dataset.team)));
  }

  // ── grid ──
  function renderGrid() {
    let h = '';
    // header
    h += '<div class="h first"><span class="pz-eyebrow">Эпик</span></div>';
    cols.forEach(c => {
      h += '<div class="h"><span class="rel' + (c.current ? ' cur' : '') + '">' + c.short + '</span><span class="dt">' + fmtSpan(c) + '</span></div>';
    });

    D.teams.forEach(team => {
      const isFocus = team === focus;
      const eps = D.helpers.teamEpics(team);
      if (isFocus) {
        // заголовок-полоса
        const risk = teamRisk(team);
        h += '<div class="teamhdr" data-team="' + team + '"><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="tn">' + team + '</span><span class="tc">' + eps.length + ' эпиков · раскрыто</span></div>';
        // детальные строки — прямые grid-дети (subgrid не нужен)
        eps.forEach(e => {
          const riskDot = e.risk ? '<span class="risk" style="background:' + riskVar(e.risk) + '"></span>' : '';
          h += '<div class="lbl"><span class="nm">' + riskDot + e.epic + '</span><span class="est">' + D.helpers.effortOf(e) + ' дн · ' + e.pills.length + ' работ</span></div>';
          cols.forEach(c => {
            const bz = c.key === 'backlog' || c.key === 'overtime';
            h += '<div class="c' + (bz ? ' bz' : '') + '">';
            D.helpers.pillsOf(e, c.key).forEach(p => {
              const who = p.who ? '<span class="who">' + p.who + '</span>' : '';
              h += '<div class="pill" data-state="' + p.state + '" style="--wt:var(' + wtVar(p.wt) + ')"><span class="nm">' + p.wt + '</span>' + who + '</div>';
            });
            h += '</div>';
          });
        });
      } else {
        // сводная строка
        const risk = teamRisk(team);
        const rdot = risk ? '<span class="rdot" style="background:' + riskVar(risk) + '"></span>' : '';
        h += '<div class="sumrow" data-team="' + team + '">';
        h += '<div class="scol slabel"><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' + rdot + '<span class="tn">' + team + '</span><span class="tc">' + eps.length + ' эп</span></div>';
        cols.forEach(c => {
          const l = D.helpers.loadByTeamRelease(team, c.key);
          const over = l >= OVERLOAD && risk;
          const loadColor = risk === 'off-course' ? 'var(--prizma-off-course)' : 'var(--prizma-drift)';
          const dots = Array.from({ length: l }, () => '<span class="d"></span>').join('');
          h += '<div class="scol" style="--load:' + loadColor + '">' +
            '<div class="dots' + (over ? ' over' : '') + '">' + (dots || '<span class="scnt" style="opacity:.4">—</span>') + '</div>' +
            (l ? '<span class="scnt' + (over ? ' over' : '') + '">' + l + ' раб</span>' : '') +
            '</div>';
        });
        h += '</div>';
      }
    });
    grid.innerHTML = h;

    // клики
    grid.querySelectorAll('.sumrow').forEach(r => r.addEventListener('click', () => setFocus(r.dataset.team)));
    grid.querySelectorAll('.teamhdr').forEach(r => r.addEventListener('click', () => {
      // клик по раскрытому — свернуть к следующей соседней (демонстрация перехода фокуса)
      const i = D.teams.indexOf(r.dataset.team);
      const next = D.teams[(i + 1) % D.teams.length];
      setFocus(next);
    }));

    placeToday();
    setTimeout(placeToday, 60);
  }

  function setFocus(team) {
    if (team === focus) return;
    // плавно: затухание текущей раскладки, затем перерисовка и появление новой
    focus = team;
    renderRail();
    grid.classList.add('leaving');
    setTimeout(() => { grid.classList.remove('leaving'); renderGrid(); }, 200);
  }

  // today-axis в текущем окне
  function placeToday() {
    grid.querySelector('.today')?.remove();
    const heads = [...grid.querySelectorAll('.h')];
    const curIdx = cols.findIndex(c => c.current);
    const cur = heads[curIdx + 1];
    if (!cur) return;
    const c = cols[curIdx];
    const total = new Date(c.end) - new Date(c.start);
    const pct = total > 0 ? (new Date(D.today) - new Date(c.start)) / total : .5;
    const gr = grid.getBoundingClientRect(), hr = cur.getBoundingClientRect();
    const left = (hr.left - gr.left) + hr.width * Math.max(0, Math.min(1, pct));
    const line = document.createElement('div'); line.className = 'today';
    line.style.left = left.toFixed(1) + 'px'; line.style.height = grid.scrollHeight + 'px';
    line.innerHTML = '<span class="cap">СЕГОДНЯ 23.05</span>';
    grid.appendChild(line);
  }
  window.addEventListener('resize', placeToday);

  renderRail();
  renderGrid();

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement;
    r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

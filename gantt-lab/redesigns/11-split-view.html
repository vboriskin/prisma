<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 11 · Мастер-деталь</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .sub { font: 500 12px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .top .spacer { flex: 1; }
  .top button { color: var(--prizma-text-secondary); }

  /* ── split layout ── */
  .body { flex: 1; display: flex; min-height: 0; }

  /* left master list */
  .master { width: 320px; flex: none; border-right: 1px solid var(--prizma-border); display: flex; flex-direction: column; min-height: 0; }
  .master .mh { padding: 13px 16px 11px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .master .mh .pz-eyebrow { display: block; margin-bottom: 9px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--prizma-text-tertiary); pointer-events: none; }
  .search input { width: 100%; height: 32px; padding: 0 10px 0 30px; font: 400 13px/1 var(--font); color: var(--prizma-text-primary); background: var(--prizma-bg-tertiary); border: 1px solid var(--prizma-border); border-radius: var(--r-md); outline: none; transition: border-color .15s; }
  .search input::placeholder { color: var(--prizma-text-tertiary); }
  .search input:focus { border-color: var(--prizma-information); }

  .mlist { flex: 1; overflow-y: auto; padding: 6px 0 14px; }
  .grp { padding: 13px 16px 5px; font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-tertiary); display: flex; align-items: baseline; gap: 7px; position: sticky; top: 0; background: var(--prizma-bg); z-index: 2; }
  .grp .gc { font: 600 9.5px/1 var(--mono); color: var(--prizma-text-tertiary); }

  .row { position: relative; display: flex; align-items: center; gap: 9px; padding: 9px 16px 9px 17px; cursor: pointer; border-bottom: 1px solid var(--prizma-border); transition: background .12s; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: background .15s; }
  .row:hover { background: color-mix(in srgb, var(--prizma-text-primary) 3%, transparent); }
  .row.sel { background: var(--prizma-bg-elevated); }
  .row.sel::before { background: var(--prizma-information); }
  .row .rk { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--prizma-border-strong); }
  .row .rk.drift { background: var(--prizma-drift); } .row .rk.off { background: var(--prizma-off-course); }
  .row .rnm { flex: 1; font-size: 12.5px; font-weight: 500; line-height: 1.25; min-width: 0; }
  .row.sel .rnm { font-weight: 600; }
  .row .reff { font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); flex: none; }
  .nohits { padding: 22px 16px; font-size: 12px; color: var(--prizma-text-tertiary); font-style: italic; }

  /* right inspector */
  .insp { flex: 1; overflow-y: auto; min-width: 0; }
  .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--prizma-text-tertiary); }
  .empty-state svg { width: 30px; height: 30px; opacity: .5; }
  .empty-state p { font-size: 13px; margin: 0; }

  .ins-inner { max-width: 760px; padding: 26px 32px 60px; }
  .ins-hd { display: flex; align-items: flex-start; gap: 12px; }
  .ins-hd .titlewrap { flex: 1; min-width: 0; }
  .ins-team { display: flex; align-items: center; gap: 8px; font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-tertiary); }
  .ins-team .rdot { width: 8px; height: 8px; border-radius: 50%; }
  .ins-hd h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 9px 0 0; line-height: 1.15; }
  .ins-status { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: var(--r-md); font: 700 10.5px/1 var(--mono); letter-spacing: .3px; border: 1px solid var(--prizma-border-strong); color: var(--prizma-text-secondary); white-space: nowrap; }
  .ins-status .s-dot { width: 7px; height: 7px; border-radius: 50%; }
  .ins-status.off { border-color: var(--prizma-off-course); color: var(--prizma-off-course); }
  .ins-status.drift { border-color: var(--prizma-drift); color: var(--prizma-drift); }
  .ins-status.ok { border-color: var(--prizma-on-course); color: var(--prizma-on-course); }

  .sec { margin-top: 26px; }
  .sec > .pz-eyebrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .sec > .pz-eyebrow .cn { font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); letter-spacing: 0; }

  /* mini-track across releases */
  .track { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--prizma-border); border-radius: var(--r-lg); overflow: hidden; }
  .tcol { border-right: 1px solid var(--prizma-border); min-height: 92px; display: flex; flex-direction: column; }
  .tcol:last-child { border-right: 0; }
  .tcol.bz { background: color-mix(in srgb, var(--prizma-text-primary) 2.5%, transparent); }
  .tcol.cur { background: color-mix(in srgb, var(--prizma-information) 5%, transparent); }
  .tcol-h { padding: 8px 9px 7px; border-bottom: 1px solid var(--prizma-border); display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .tcol-h .rl { font: 400 14px/1 var(--mono); color: var(--prizma-text-secondary); }
  .tcol.cur .tcol-h .rl { color: var(--prizma-text-primary); }
  .tcol-h .dd { font: 600 8.5px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .tcol-b { flex: 1; padding: 8px 8px; display: flex; flex-direction: column; gap: 5px; }
  .tpill { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; font: 600 11px/1 var(--font); color: var(--prizma-text-primary); background: var(--prizma-bg-tertiary); border-radius: var(--r-sm); overflow: hidden; }
  .tpill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--wt, var(--prizma-information)); }
  .tpill .who { font: 500 9px/1 var(--mono); color: var(--prizma-text-tertiary); margin-left: auto; }
  .tpill[data-state="done"] { opacity: .62; }
  .tpill[data-state="done"] .pn { text-decoration: line-through; text-decoration-color: var(--prizma-text-tertiary); }
  .tpill[data-state="progress"] .pdot { width: 5px; height: 5px; border-radius: 50%; background: var(--prizma-information); flex: none; }
  .tpill[data-state="unplanned"] { background: transparent; border: 1px dashed var(--prizma-drift); }

  /* deps + risk + assignees grid */
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 32px; }
  .deplist { display: flex; flex-direction: column; gap: 6px; }
  .di { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--prizma-border); border-radius: var(--r-sm); font-size: 12px; cursor: pointer; transition: border-color .15s; }
  .di:hover { border-color: var(--prizma-information); }
  .di .mono { font: 700 9px/1 var(--mono); color: var(--prizma-text-tertiary); border: 1px solid var(--prizma-border-strong); border-radius: 3px; padding: 3px 4px; flex: none; }
  .di .dn { flex: 1; min-width: 0; }
  .di .rdot { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex: none; }
  .empty { font-size: 12px; color: var(--prizma-text-tertiary); font-style: italic; }

  .risk-card { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border: 1px solid; border-radius: var(--r-md); }
  .risk-card svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .risk-card .rt { font-size: 12.5px; line-height: 1.4; }
  .risk-card .rt b { display: block; font-weight: 700; margin-bottom: 2px; }
  .risk-card.off { border-color: var(--prizma-off-course); color: var(--prizma-off-course); }
  .risk-card.drift { border-color: var(--prizma-drift); color: var(--prizma-drift); }
  .risk-card.ok { border-color: var(--prizma-border); color: var(--prizma-on-course); }
  .risk-card .rt span { color: var(--prizma-text-secondary); font-weight: 500; }

  .people { display: flex; flex-wrap: wrap; gap: 7px; }
  .person { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border: 1px solid var(--prizma-border); border-radius: 999px; font-size: 12px; color: var(--prizma-text-primary); }
  .person .av { width: 20px; height: 20px; border-radius: 50%; background: var(--prizma-bg-tertiary); display: inline-flex; align-items: center; justify-content: center; font: 700 9px/1 var(--mono); color: var(--prizma-text-secondary); flex: none; }
  .person .pr { font: 500 9px/1 var(--mono); color: var(--prizma-text-tertiary); }

  /* effort bars */
  .effort { display: flex; flex-direction: column; gap: 8px; }
  .erow { display: grid; grid-template-columns: 96px 1fr 42px; align-items: center; gap: 11px; }
  .erow .el { font: 600 11px/1 var(--font); color: var(--prizma-text-secondary); }
  .erow .bar { height: 7px; border-radius: 3px; background: var(--prizma-bg-tertiary); overflow: hidden; }
  .erow .bar i { display: block; height: 100%; border-radius: 3px; background: var(--wt, var(--prizma-information)); }
  .erow .ev { font: 600 11px/1 var(--mono); color: var(--prizma-text-secondary); text-align: right; }
  .efoot { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; padding-top: 11px; border-top: 1px solid var(--prizma-border); }
  .efoot .et { font-size: 11px; color: var(--prizma-text-tertiary); }
  .efoot .ett { font: 700 14px/1 var(--mono); color: var(--prizma-text-primary); margin-left: auto; }

  /* moves note */
  .moves { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--prizma-bg-elevated); border: 1px solid var(--prizma-border); border-radius: var(--r-md); }
  .moves svg { width: 16px; height: 16px; flex: none; color: var(--prizma-text-tertiary); margin-top: 1px; }
  .moves .mt { font-size: 12.5px; line-height: 1.45; color: var(--prizma-text-secondary); }
  .moves .mt b { color: var(--prizma-text-primary); font-weight: 700; }
  .moves.warn svg { color: var(--prizma-drift); }
  .kbd-hint { margin-top: 30px; font-size: 11px; color: var(--prizma-text-tertiary); display: flex; align-items: center; gap: 8px; }
  .kbd-hint kbd { font: 600 10px/1 var(--mono); border: 1px solid var(--prizma-border-strong); border-radius: 4px; padding: 3px 6px; color: var(--prizma-text-secondary); }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Мастер-деталь</span>
    <span class="pz-eyebrow">Редизайн 11 · split-view</span>
    <span class="spacer"></span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>

  <div class="body">
    <aside class="master">
      <div class="mh">
        <span class="pz-eyebrow">Эпики · 16</span>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Поиск по эпикам и командам…" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="mlist" id="mlist"></div>
    </aside>
    <main class="insp" id="insp"></main>
  </div>

<script>
(function () {
  const D = window.PZ_DATA, H = D.helpers, cols = D.releases;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const wtVar = wt => 'var(' + ({BE:'--wt-be',FE:'--wt-fe',QA:'--wt-qa',AN:'--wt-an',BA:'--wt-ba',IMPL:'--wt-impl',MIG:'--wt-mig',STAB:'--wt-stab',HF:'--wt-hf'}[wt] || '--prizma-information') + ')';
  const byId = {}; D.epics.forEach(e => byId[e.id] = e);
  const relShort = k => { const c = cols.find(c => c.key === k); return c ? c.short : k; };

  // обратные связи: кто блокирует кого (blocks = inverse of deps)
  const blocks = {}; D.epics.forEach(e => blocks[e.id] = []);
  D.epics.forEach(e => (e.deps || []).forEach(d => { if (blocks[d]) blocks[d].push(e.id); }));

  const mlist = document.getElementById('mlist');
  const insp = document.getElementById('insp');
  const qInput = document.getElementById('q');

  let selId = null;
  let visible = []; // плоский список видимых id (для ↑/↓)
  let query = '';

  function matches(e) {
    if (!query) return true;
    const hay = (e.epic + ' ' + e.team).toLowerCase();
    return hay.includes(query);
  }

  function renderList() {
    visible = [];
    let html = '';
    D.teams.forEach(team => {
      const eps = H.teamEpics(team).filter(matches);
      if (!eps.length) return;
      html += '<div class="grp">' + esc(team) + '<span class="gc">' + eps.length + '</span></div>';
      eps.forEach(e => {
        visible.push(e.id);
        const rkCls = e.risk === 'off-course' ? ' off' : (e.risk === 'drift' ? ' drift' : '');
        html += '<div class="row' + (e.id === selId ? ' sel' : '') + '" data-id="' + e.id + '">' +
          '<span class="rk' + rkCls + '"></span>' +
          '<span class="rnm">' + esc(e.epic) + '</span>' +
          '<span class="reff pz-mono">' + H.effortOf(e) + 'д</span>' +
          '</div>';
      });
    });
    mlist.innerHTML = html || '<div class="nohits">Ничего не найдено по запросу «' + esc(query) + '».</div>';
    mlist.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => select(r.dataset.id)));
  }

  function statusOf(e) {
    if (e.risk === 'off-course') return { cls: 'off', dot: 'var(--prizma-off-course)', label: 'РИСК СРЫВА' };
    if (e.risk === 'drift') return { cls: 'drift', dot: 'var(--prizma-drift)', label: 'ДРЕЙФ' };
    const r = H.doneRatio(e);
    if (r >= 0.999) return { cls: 'ok', dot: 'var(--prizma-on-course)', label: 'ЗАВЕРШЁН' };
    if (e.pills.some(p => p.state === 'progress')) return { cls: 'ok', dot: 'var(--prizma-on-course)', label: 'ПО КУРСУ' };
    return { cls: '', dot: 'var(--prizma-text-secondary)', label: 'ЗАПЛАНИРОВАН' };
  }

  function trackHtml(e) {
    return cols.map(c => {
      const bz = c.key === 'backlog' || c.key === 'overtime';
      const dd = c.dated ? new Date(c.start).toLocaleDateString('ru', {day:'2-digit',month:'short'}) : '—';
      const pills = H.pillsOf(e, c.key);
      const body = pills.map(p => {
        const who = p.who ? '<span class="who">' + esc(p.who) + '</span>' : '';
        const dot = p.state === 'progress' ? '<span class="pdot"></span>' : '';
        return '<div class="tpill" data-state="' + p.state + '" style="--wt:' + wtVar(p.wt) + '" title="' + esc(D.WT[p.wt] ? D.WT[p.wt].label : p.wt) + '">' + dot + '<span class="pn">' + esc(p.wt) + '</span>' + who + '</div>';
      }).join('');
      return '<div class="tcol' + (bz ? ' bz' : '') + (c.current ? ' cur' : '') + '">' +
        '<div class="tcol-h"><span class="rl">' + esc(c.short) + '</span><span class="dd">' + dd + '</span></div>' +
        '<div class="tcol-b">' + body + '</div></div>';
    }).join('');
  }

  function depBlock(ids) {
    if (!ids || !ids.length) return '<div class="empty">нет связей</div>';
    return '<div class="deplist">' + ids.map(id => {
      const e = byId[id]; if (!e) return '';
      const rd = e.risk ? '<span class="rdot" style="background:var(--prizma-' + e.risk + ')"></span>' : '';
      return '<div class="di" data-id="' + id + '"><span class="mono">' + esc(e.team.slice(0,2).toUpperCase()) + '</span><span class="dn">' + esc(e.epic) + '</span>' + rd + '</div>';
    }).join('') + '</div>';
  }

  function riskHtml(e) {
    if (e.risk === 'off-course') return '<div class="risk-card off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div class="rt"><b>Риск срыва</b><span>Эпик отстаёт от плана; требуется вмешательство владельца.</span></div></div>';
    if (e.risk === 'drift') return '<div class="risk-card drift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><div class="rt"><b>Дрейф</b><span>Сроки плывут — стоит проверить нагрузку и зависимости.</span></div></div>';
    return '<div class="risk-card ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><div class="rt"><b>По курсу</b><span>Рисков не отмечено.</span></div></div>';
  }

  function peopleHtml(e) {
    // уникальные исполнители из pills.who + дисциплина
    const seen = {}; const list = [];
    e.pills.forEach(p => { if (p.who && !seen[p.who]) { seen[p.who] = 1; list.push({ who: p.who, wt: p.wt }); } });
    if (!list.length) return '<div class="empty">исполнители не назначены</div>';
    return '<div class="people">' + list.map(x => {
      const init = x.who.slice(0, 2);
      return '<span class="person"><span class="av">' + esc(init) + '</span>' + esc(x.who) + '<span class="pr">' + esc(x.wt) + '</span></span>';
    }).join('') + '</div>';
  }

  const DISC = { be:'backend', fe:'frontend', qa:'тестирование', an:'аналитика', ba:'бизнес-анализ', impl:'внедрение', mig:'миграция', stab:'стабилизация', hf:'хотфикс' };
  const DISC_WT = { be:'BE', fe:'FE', qa:'QA', an:'AN', ba:'BA', impl:'IMPL', mig:'MIG', stab:'STAB', hf:'HF' };
  function effortHtml(e) {
    const est = e.est || {};
    const entries = Object.keys(est).map(k => [k, est[k]]).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return '<div class="empty">оценка не задана</div>';
    const max = Math.max.apply(null, entries.map(x => x[1]));
    const total = entries.reduce((a, x) => a + x[1], 0);
    const rows = entries.map(([k, v]) => {
      const pct = max > 0 ? (v / max * 100) : 0;
      return '<div class="erow"><span class="el">' + esc(DISC[k] || k) + '</span>' +
        '<span class="bar"><i style="width:' + pct.toFixed(1) + '%;--wt:' + wtVar(DISC_WT[k]) + '"></i></span>' +
        '<span class="ev">' + v + '</span></div>';
    }).join('');
    return '<div class="effort">' + rows + '</div><div class="efoot"><span class="et">человеко-дней всего</span><span class="ett">' + total + '</span></div>';
  }

  function movesHtml(e) {
    const n = e.moves || 0;
    if (n === 0) return '<div class="moves"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg><div class="mt"><b>Без переносов.</b> Эпик стабильно держится в исходных окнах с начала квартала.</div></div>';
    const word = n === 1 ? 'перенос' : (n < 5 ? 'переноса' : 'переносов');
    return '<div class="moves warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><div class="mt"><b>' + n + ' ' + word + '</b> между релизами за квартал — стоит присмотреться к планированию этого эпика.</div></div>';
  }

  function renderInspector() {
    if (!selId) {
      insp.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="13" y="3" width="8" height="9" rx="1.5"/><rect x="13" y="15" width="8" height="6" rx="1.5"/></svg><p>Выберите эпик слева, чтобы открыть карточку</p></div>';
      return;
    }
    const e = byId[selId];
    const st = statusOf(e);
    const planned = cols.filter(c => H.pillsOf(e, c.key).length).map(c => c.short).join(', ') || '—';
    let h = '<div class="ins-inner">';
    h += '<div class="ins-hd"><div class="titlewrap">' +
      '<div class="ins-team">' + (e.risk ? '<span class="rdot" style="background:var(--prizma-' + e.risk + ')"></span>' : '') + esc(e.team) + '</div>' +
      '<h1>' + esc(e.epic) + '</h1></div>' +
      '<span class="ins-status ' + st.cls + '"><span class="s-dot" style="background:' + st.dot + '"></span>' + st.label + '</span></div>';

    h += '<div class="sec"><span class="pz-eyebrow">Работы по релизам<span class="cn">' + e.pills.length + ' работ · окна: ' + esc(planned) + '</span></span><div class="track">' + trackHtml(e) + '</div></div>';

    h += '<div class="sec cols2-wrap"><div class="cols2">' +
      '<div><span class="pz-eyebrow" style="display:block;margin-bottom:12px">Зависит от</span>' + depBlock(e.deps) + '</div>' +
      '<div><span class="pz-eyebrow" style="display:block;margin-bottom:12px">Блокирует</span>' + depBlock(blocks[selId]) + '</div>' +
      '</div></div>';

    h += '<div class="sec"><span class="pz-eyebrow">Статус и риск</span>' + riskHtml(e) + '</div>';

    h += '<div class="sec"><span class="pz-eyebrow">Исполнители</span>' + peopleHtml(e) + '</div>';

    h += '<div class="sec"><span class="pz-eyebrow">Оценка по дисциплинам</span>' + effortHtml(e) + '</div>';

    h += '<div class="sec"><span class="pz-eyebrow">История · переезды</span>' + movesHtml(e) + '</div>';

    h += '<div class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> переключение эпиков в списке</div>';
    h += '</div>';
    insp.innerHTML = h;

    insp.querySelectorAll('.di').forEach(di => di.addEventListener('click', () => select(di.dataset.id)));
  }

  function select(id, opts) {
    selId = id;
    renderList();
    renderInspector();
    // прокрутить выбранную строку в видимую область
    const row = mlist.querySelector('.row.sel');
    if (row && (!opts || opts.scroll !== false)) row.scrollIntoView({ block: 'nearest' });
  }

  // ── поиск ──
  qInput.addEventListener('input', () => {
    query = qInput.value.trim().toLowerCase();
    renderList();
    // если выбранный отфильтрован — снять выбор визуально, но карточку оставить
  });

  // ── ↑/↓ навигация по видимому списку ──
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    if (document.activeElement === qInput && qInput.value) { /* позволяем стрелки в поле, но всё равно навигируем список */ }
    if (!visible.length) return;
    ev.preventDefault();
    let idx = visible.indexOf(selId);
    if (idx === -1) { idx = ev.key === 'ArrowDown' ? 0 : visible.length - 1; }
    else { idx += ev.key === 'ArrowDown' ? 1 : -1; idx = Math.max(0, Math.min(visible.length - 1, idx)); }
    select(visible[idx]);
  });

  // ── init ──
  renderList();
  // выбрать первый рисковый эпик по умолчанию для наглядности
  const first = D.epics.find(e => e.risk === 'off-course') || D.epics[0];
  select(first.id, { scroll: false });

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

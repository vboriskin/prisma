<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 30 · Слайды квартала</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar (slim) ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; z-index: 20; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .eyebrow { margin-left: 2px; }
  .top .spacer { flex: 1; }
  .top .counter { font: 700 12px/1 var(--mono); color: var(--prizma-text-secondary); letter-spacing: .3px; }
  .top .counter b { color: var(--prizma-text-primary); }

  /* ── stage ── */
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 48px 72px 84px; display: flex; flex-direction: column; opacity: 0; transform: translateX(28px); pointer-events: none; transition: opacity .4s var(--ease-calm), transform .4s var(--ease-calm); overflow-y: auto; }
  .slide.active { opacity: 1; transform: none; pointer-events: auto; }
  .slide.prev { transform: translateX(-28px); }

  .s-eyebrow { color: var(--prizma-text-tertiary); }
  .s-eyebrow.acc { color: var(--prizma-information); }
  .s-eyebrow.risk { color: var(--prizma-off-course); }
  h1.s-title { font-size: 40px; font-weight: 800; letter-spacing: -.025em; margin: 12px 0 0; line-height: 1.05; }
  .s-lede { margin-top: 14px; font-size: 16px; color: var(--prizma-text-secondary); max-width: 760px; line-height: 1.5; }
  .s-body { margin-top: 40px; flex: 1; min-height: 0; }

  /* overview KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .kpi { border-left: 3px solid var(--prizma-border-strong); padding: 4px 0 4px 18px; }
  .kpi.prog { border-color: var(--prizma-information); }
  .kpi.risk { border-color: var(--prizma-off-course); }
  .kpi.done { border-color: var(--prizma-on-course); }
  .kpi .kl { font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-tertiary); }
  .kpi .kv { margin-top: 12px; font: 800 46px/1 var(--mono); letter-spacing: -.02em; }
  .kpi .kv small { font-size: 22px; font-weight: 700; color: var(--prizma-text-tertiary); margin-left: 3px; }
  .kpi.risk .kv { color: var(--prizma-off-course); }
  .kpi.prog .kv { color: var(--prizma-information); }
  .kpi.done .kv { color: var(--prizma-on-course); }
  .kpi .ks { margin-top: 8px; font-size: 12px; color: var(--prizma-text-tertiary); }

  .ov-ms { margin-top: 44px; }
  .ov-ms .cap { font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-tertiary); margin-bottom: 16px; }
  .ms-line { display: flex; gap: 14px; flex-wrap: wrap; }
  .ms-card { position: relative; padding: 12px 16px 12px 17px; border: 1px solid var(--prizma-border); border-radius: var(--r-md); min-width: 180px; }
  .ms-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--prizma-text-secondary); border-radius: var(--r-md) 0 0 var(--r-md); }
  .ms-card.past::before { background: var(--prizma-text-tertiary); opacity: .6; }
  .ms-card.soon::before { background: var(--prizma-information); }
  .ms-card .md { font: 700 13px/1 var(--mono); color: var(--prizma-text-secondary); }
  .ms-card.soon .md { color: var(--prizma-information); }
  .ms-card .ml { margin-top: 6px; font-size: 13px; font-weight: 600; }
  .ms-card .mw { margin-top: 4px; font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); }

  /* team slide */
  .team-grid { display: grid; grid-template-columns: 280px 1fr; gap: 48px; height: 100%; }
  .team-stats { display: flex; flex-direction: column; gap: 22px; }
  .ts-big { }
  .ts-big .v { font: 800 56px/1 var(--mono); letter-spacing: -.02em; }
  .ts-big .v small { font-size: 24px; color: var(--prizma-text-tertiary); margin-left: 4px; }
  .ts-big .l { margin-top: 6px; font-size: 13px; color: var(--prizma-text-secondary); }
  .ts-load .l { font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-tertiary); margin-bottom: 11px; }
  .load-row { display: grid; grid-template-columns: 38px 1fr 28px; align-items: center; gap: 10px; margin-bottom: 8px; }
  .load-row .rk { font: 700 11px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .load-row .rk.cur { color: var(--prizma-information); }
  .load-row .tr { height: 7px; border-radius: 4px; background: var(--prizma-bg-tertiary); overflow: hidden; }
  .load-row .tr i { display: block; height: 100%; background: var(--prizma-text-secondary); border-radius: 4px; }
  .load-row.cur .tr i { background: var(--prizma-information); }
  .load-row .rv { font: 700 11px/1 var(--mono); color: var(--prizma-text-secondary); text-align: right; }

  .team-epics { overflow-y: auto; min-height: 0; }
  .te-row { position: relative; display: flex; align-items: center; gap: 13px; padding: 13px 4px 13px 16px; border-bottom: 1px solid var(--prizma-border); }
  .te-row:last-child { border-bottom: 0; }
  .te-row::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--prizma-border-strong); }
  .te-row.r-drift::before { background: var(--prizma-drift); }
  .te-row.r-off::before { background: var(--prizma-off-course); }
  .te-row .en { flex: 1; min-width: 0; }
  .te-row .en .nm { font-size: 15px; font-weight: 600; }
  .te-row .en .mt { margin-top: 4px; font: 600 11px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .te-row .prog { width: 120px; flex: none; }
  .te-row .prog .tr { height: 5px; border-radius: 3px; background: var(--prizma-bg-tertiary); overflow: hidden; }
  .te-row .prog .tr i { display: block; height: 100%; background: var(--prizma-text-secondary); }
  .te-row.done .prog .tr i { background: var(--prizma-on-course); }
  .te-row .prog .pp { margin-top: 5px; font: 700 10px/1 var(--mono); color: var(--prizma-text-tertiary); text-align: right; }

  /* risks slide */
  .rk-list { display: flex; flex-direction: column; gap: 0; }
  .rk-row { position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 6px 18px 20px; border-bottom: 1px solid var(--prizma-border); }
  .rk-row:last-child { border-bottom: 0; }
  .rk-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--prizma-drift); }
  .rk-row.off::before { background: var(--prizma-off-course); }
  .rk-row .badge { flex: none; font: 700 9px/1 var(--mono); letter-spacing: .5px; text-transform: uppercase; padding: 5px 8px; border-radius: var(--r-sm); color: var(--prizma-drift); background: var(--prizma-drift-bg); }
  .rk-row.off .badge { color: var(--prizma-off-course); background: var(--prizma-off-course-bg); }
  .rk-row .rm { flex: 1; min-width: 0; }
  .rk-row .rm .nm { font-size: 17px; font-weight: 600; }
  .rk-row .rm .st { margin-top: 5px; font-size: 12.5px; color: var(--prizma-text-tertiary); }
  .rk-row .moves { flex: none; text-align: right; }
  .rk-row .moves .v { font: 800 24px/1 var(--mono); color: var(--prizma-text-secondary); }
  .rk-row .moves .l { margin-top: 4px; font: 600 8.5px/1 var(--mono); letter-spacing: .4px; text-transform: uppercase; color: var(--prizma-text-tertiary); }

  /* milestones slide */
  .ms-time { position: relative; margin-top: 30px; padding: 50px 10px 50px; flex: 1; }
  .ms-time .axis { position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--prizma-border-strong); }
  .ms-time .now { position: absolute; top: 20px; bottom: 20px; width: 0; border-left: 2px solid var(--prizma-information); }
  .ms-time .now .cap { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font: 700 9px/1 var(--mono); letter-spacing: .5px; color: var(--prizma-information); white-space: nowrap; }
  .ms-time .pt { position: absolute; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
  .ms-time .pt .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--prizma-text-secondary); background: var(--prizma-bg); z-index: 2; }
  .ms-time .pt.past .dot { border-color: var(--prizma-text-tertiary); background: var(--prizma-text-tertiary); opacity: .6; }
  .ms-time .pt.soon .dot { border-color: var(--prizma-information); background: var(--prizma-information); }
  .ms-time .pt .lb { position: absolute; bottom: 26px; font: 600 13px/1.3 var(--font); white-space: nowrap; text-align: center; color: var(--prizma-text-primary); }
  .ms-time .pt .dd { position: absolute; top: 26px; font: 700 12px/1 var(--mono); color: var(--prizma-text-tertiary); white-space: nowrap; }
  .ms-time .pt:nth-child(even) .lb { bottom: auto; top: 26px; }
  .ms-time .pt:nth-child(even) .dd { top: auto; bottom: 26px; }

  /* ── nav ── */
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 24px; z-index: 15; }
  .nav-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--prizma-border-strong); border-radius: 50%; background: var(--prizma-bg-elevated); color: var(--prizma-text-secondary); cursor: pointer; transition: border-color .15s, color .15s, opacity .15s; }
  .nav-btn:hover { border-color: var(--prizma-information); color: var(--prizma-information); }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn svg { width: 17px; height: 17px; }
  .dots { display: flex; align-items: center; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--prizma-border-strong); cursor: pointer; transition: background .2s, transform .2s, width .25s; padding: 0; border: 0; }
  .dot:hover { background: var(--prizma-text-tertiary); }
  .dot.on { background: var(--prizma-information); width: 22px; border-radius: 4px; }

  .hint { position: absolute; right: 24px; bottom: 19px; font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); letter-spacing: .3px; display: flex; align-items: center; gap: 6px; }
  .hint kbd { font: 700 10px/1 var(--mono); padding: 3px 6px; border: 1px solid var(--prizma-border-strong); border-radius: 4px; color: var(--prizma-text-secondary); }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Слайды квартала</span>
    <span class="pz-eyebrow eyebrow">Редизайн 30 · deck</span>
    <span class="spacer"></span>
    <span class="counter" id="counter"><b>1</b> / 8</span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="nav">
    <button class="nav-btn" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> листать</div>

<script>
(function () {
  const D = window.PZ_DATA, cols = D.releases;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const now = new Date(D.today);
  const datedKeys = ['r120', 'r121', 'r122'];

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function relShort(key) { const c = cols.find(x => x.key === key); return c ? c.short : key; }

  // ── slide builders ──
  const slides = [];

  // (1) Обзор квартала — KPIs + вехи
  slides.push(function () {
    const totEpics = D.epics.length;
    const inProgress = D.epics.filter(e => e.pills.some(p => p.state === 'progress')).length;
    const allPills = D.epics.reduce((n, e) => n + e.pills.length, 0);
    const donePills = D.epics.reduce((n, e) => n + e.pills.filter(p => p.state === 'done').length, 0);
    const donePct = Math.round(donePills / allPills * 100);
    const atRisk = D.epics.filter(e => e.risk).length;
    const kpis = [
      { l: 'Эпиков', v: totEpics, s: D.teams.length + ' команд', cls: '' },
      { l: 'В работе', v: inProgress, s: 'активных эпиков', cls: 'prog' },
      { l: 'Готово', v: donePct, u: '%', s: donePills + ' из ' + allPills + ' работ', cls: 'done' },
      { l: 'Под риском', v: atRisk, s: 'дрейф + срыв', cls: 'risk' },
    ];
    const msHtml = D.milestones.map(m => {
      const t = new Date(m.date).getTime();
      const cls = t < now.getTime() ? 'past' : (Math.abs(t - now.getTime()) <= 9 * 864e5 ? 'soon' : '');
      const dd = new Date(m.date).toLocaleDateString('ru', { day: '2-digit', month: 'long' });
      return '<div class="ms-card ' + cls + '"><div class="md">' + dd + '</div><div class="ml">' + esc(m.label) + '</div></div>';
    }).join('');
    return '<div class="s-eyebrow pz-eyebrow">Призма · квартал Q2</div>' +
      '<h1 class="s-title">Обзор квартала</h1>' +
      '<p class="s-lede">Статус на 23 мая. Идёт окно 1.21 — экватор квартала. Ниже — ключевые цифры и вехи, к которым движемся.</p>' +
      '<div class="s-body"><div class="kpis">' +
      kpis.map(k => '<div class="kpi ' + k.cls + '"><div class="kl">' + esc(k.l) + '</div><div class="kv">' + k.v + (k.u ? '<small>' + k.u + '</small>' : '') + '</div><div class="ks">' + esc(k.s) + '</div></div>').join('') +
      '</div><div class="ov-ms"><div class="cap">Вехи квартала</div><div class="ms-line">' + msHtml + '</div></div></div>';
  });

  // (2..N) по слайду на команду
  D.teams.forEach((team, ti) => {
    slides.push(function () {
      const eps = D.helpers.teamEpics(team);
      const totDays = eps.reduce((a, e) => a + D.helpers.effortOf(e), 0);
      const risks = eps.filter(e => e.risk).length;
      const allPills = eps.reduce((n, e) => n + e.pills.length, 0) || 1;
      const donePills = eps.reduce((n, e) => n + e.pills.filter(p => p.state === 'done').length, 0);
      const donePct = Math.round(donePills / allPills * 100);
      // загрузка по датированным релизам
      let maxLoad = 1;
      const loads = datedKeys.map(k => { const v = D.helpers.loadByTeamRelease(team, k); if (v > maxLoad) maxLoad = v; return { k, v }; });
      const loadHtml = loads.map(ld => {
        const cur = cols.find(c => c.key === ld.k && c.current);
        return '<div class="load-row' + (cur ? ' cur' : '') + '"><span class="rk' + (cur ? ' cur' : '') + '">' + relShort(ld.k) + '</span>' +
          '<span class="tr"><i style="width:' + (ld.v / maxLoad * 100).toFixed(0) + '%"></i></span>' +
          '<span class="rv">' + ld.v + '</span></div>';
      }).join('');
      const epHtml = eps.map(e => {
        const riskCls = e.risk === 'off-course' ? 'r-off' : (e.risk === 'drift' ? 'r-drift' : '');
        const pct = Math.round(D.helpers.doneRatio(e) * 100);
        const doneCls = pct === 100 ? ' done' : '';
        const moves = e.moves ? ' · ' + e.moves + ' ' + plural(e.moves, 'перенос', 'переноса', 'переносов') : '';
        return '<div class="te-row ' + riskCls + doneCls + '">' +
          '<div class="en"><div class="nm">' + esc(e.epic) + '</div><div class="mt">' + D.helpers.effortOf(e) + ' дн · ' + e.pills.length + ' раб' + moves + '</div></div>' +
          '<div class="prog"><div class="tr"><i style="width:' + pct + '%"></i></div><div class="pp">' + pct + '%</div></div></div>';
      }).join('');
      return '<div class="s-eyebrow pz-eyebrow">Команда ' + (ti + 1) + ' из ' + D.teams.length + '</div>' +
        '<h1 class="s-title">' + esc(team) + '</h1>' +
        '<p class="s-lede">' + eps.length + ' ' + plural(eps.length, 'эпик', 'эпика', 'эпиков') + ' · ' + totDays + ' человеко-дней' + (risks ? ' · ' + risks + ' под риском' : ' · рисков нет') + '.</p>' +
        '<div class="s-body"><div class="team-grid"><div class="team-stats">' +
        '<div class="ts-big"><div class="v">' + donePct + '<small>%</small></div><div class="l">готовности работ команды</div></div>' +
        '<div class="ts-load"><div class="l">Загрузка по релизам</div>' + loadHtml + '</div></div>' +
        '<div class="team-epics">' + epHtml + '</div></div></div>';
    });
  });

  // (N+1) Риски квартала
  slides.push(function () {
    const risky = D.epics.filter(e => e.risk).sort((a, b) => {
      const r = (b.risk === 'off-course' ? 1 : 0) - (a.risk === 'off-course' ? 1 : 0);
      return r !== 0 ? r : (b.moves || 0) - (a.moves || 0);
    });
    const byId = id => D.epics.find(e => e.id === id);
    const rows = risky.map(e => {
      const off = e.risk === 'off-course';
      const deps = (e.deps || []).map(byId).filter(Boolean).filter(d => D.helpers.doneRatio(d) < 1);
      const ratio = Math.round(D.helpers.doneRatio(e) * 100);
      const st = e.team + ' · готовность ' + ratio + '%' + (deps.length ? ' · ждёт «' + deps[0].epic + '»' : '');
      return '<div class="rk-row ' + (off ? 'off' : '') + '"><span class="badge">' + (off ? 'срыв' : 'дрейф') + '</span>' +
        '<div class="rm"><div class="nm">' + esc(e.epic) + '</div><div class="st">' + esc(st) + '</div></div>' +
        '<div class="moves"><div class="v">' + e.moves + '</div><div class="l">переносов</div></div></div>';
    }).join('');
    return '<div class="s-eyebrow risk pz-eyebrow">Внимание</div>' +
      '<h1 class="s-title">Риски квартала</h1>' +
      '<p class="s-lede">' + risky.length + ' ' + plural(risky.length, 'эпик', 'эпика', 'эпиков') + ' требуют внимания. Срыв сроков — выше дрейфа; внутри сортировка по числу переносов.</p>' +
      '<div class="s-body"><div class="rk-list">' + rows + '</div></div>';
  });

  // (N+2) Вехи
  slides.push(function () {
    return '<div class="s-eyebrow acc pz-eyebrow">Календарь</div>' +
      '<h1 class="s-title">Вехи</h1>' +
      '<p class="s-lede">Ключевые точки квартала на одной оси. Сегодня — голубая линия; пройденные вехи приглушены.</p>' +
      '<div class="s-body"><div class="ms-time" id="ms-time"><div class="axis"></div><div class="now" id="ms-now"><span class="cap">СЕГОДНЯ 23.05</span></div></div></div>';
  });

  // ── render slides ──
  const stage = document.getElementById('stage');
  const total = slides.length;
  slides.forEach((build, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.dataset.idx = i;
    el.innerHTML = build();
    stage.appendChild(el);
  });

  // dots
  const dotsWrap = document.getElementById('dots');
  for (let i = 0; i < total; i++) {
    const b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' on' : '');
    b.setAttribute('aria-label', 'Слайд ' + (i + 1));
    b.dataset.idx = i;
    dotsWrap.appendChild(b);
  }

  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  let cur = 0;

  // позиционирование оси вех (нужно после того как слайд виден → есть ширина)
  function placeMs() {
    const wrap = document.getElementById('ms-time'); if (!wrap) return;
    const lo = new Date(cols.find(c => c.key === 'r120').start).getTime();
    const hi = new Date(cols.find(c => c.key === 'r122').end).getTime();
    const span = hi - lo || 1;
    const pos = t => Math.max(4, Math.min(96, ((t - lo) / span) * 100));
    const nowEl = document.getElementById('ms-now');
    if (nowEl) nowEl.style.left = pos(now.getTime()).toFixed(2) + '%';
    wrap.querySelectorAll('.pt').forEach(n => n.remove());
    D.milestones.forEach(m => {
      const t = new Date(m.date).getTime();
      const cls = t < now.getTime() ? 'past' : (Math.abs(t - now.getTime()) <= 9 * 864e5 ? 'soon' : '');
      const dd = new Date(m.date).toLocaleDateString('ru', { day: '2-digit', month: 'short' });
      const el = document.createElement('div');
      el.className = 'pt ' + cls;
      el.style.left = pos(t).toFixed(2) + '%';
      el.innerHTML = '<span class="lb">' + esc(m.label) + '</span><span class="dot"></span><span class="dd">' + dd + '</span>';
      wrap.appendChild(el);
    });
  }

  function go(n) {
    n = Math.max(0, Math.min(total - 1, n));
    if (n === cur) return;
    const slideEls = stage.querySelectorAll('.slide');
    slideEls[cur].classList.remove('active');
    slideEls[cur].classList.toggle('prev', n > cur);
    cur = n;
    slideEls[cur].classList.remove('prev');
    slideEls[cur].classList.add('active');
    update();
  }
  function update() {
    counter.innerHTML = '<b>' + (cur + 1) + '</b> / ' + total;
    dotsWrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === total - 1;
    // ось вех — на последнем слайде; кладём после смены active (layout готов) + страховка
    placeMs();
    setTimeout(placeMs, 60);
  }

  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));
  dotsWrap.addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) go(+d.dataset.idx); });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(total - 1); }
  });
  window.addEventListener('resize', placeMs);

  update();
  placeMs();
  setTimeout(placeMs, 60);

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    setTimeout(placeMs, 30);
  });
})();
</script>
</body>
</html>

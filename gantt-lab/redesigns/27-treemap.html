<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 27 · Карта-площадь</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .eyebrow { margin-left: 2px; }
  .top .spacer { flex: 1; }
  .top .legend { display: flex; gap: 13px; font-size: 11px; color: var(--prizma-text-tertiary); align-items: center; }
  .top .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* ── canvas ── */
  .wrap { flex: 1; min-height: 0; padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
  .intro { display: flex; align-items: baseline; gap: 12px; flex: none; }
  .intro .pz-eyebrow { color: var(--prizma-text-tertiary); }
  .intro .note { font-size: 11.5px; color: var(--prizma-text-tertiary); }

  .map { position: relative; flex: 1; min-height: 0; border: 1px solid var(--prizma-border); border-radius: var(--r-lg); background: var(--prizma-bg-elevated); overflow: hidden; }

  /* команда-группа */
  .grp { position: absolute; overflow: hidden; }
  .grp-h { position: absolute; top: 0; left: 0; right: 0; height: 22px; padding: 0 9px; display: flex; align-items: center; gap: 7px; z-index: 3; pointer-events: none; }
  .grp-h .tn { font: 700 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--prizma-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp-h .te { font: 600 9.5px/1 var(--mono); color: var(--prizma-text-tertiary); flex: none; }
  .grp::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--prizma-border-strong); border-radius: var(--r-sm); pointer-events: none; }

  /* эпик-прямоугольник */
  .rect { position: absolute; overflow: hidden; cursor: default; transition: filter .12s var(--ease-calm); }
  .rect .fill { position: absolute; inset: 1px; border-radius: 3px; background: var(--prizma-bg-tertiary); }
  /* 3px stripe-left семантического статуса */
  .rect .fill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--st, var(--prizma-border-strong)); border-radius: 3px 0 0 3px; }
  .rect.s-done .fill { background: var(--prizma-on-course-bg); }
  .rect.s-done .fill::before { background: var(--prizma-on-course); }
  .rect.s-prog .fill { background: var(--prizma-information-bg); }
  .rect.s-prog .fill::before { background: var(--prizma-information); }
  .rect.s-plan .fill { background: var(--prizma-bg-tertiary); }
  .rect.s-plan .fill::before { background: var(--prizma-border-strong); }
  .rect.s-drift .fill { background: var(--prizma-drift-bg); }
  .rect.s-drift .fill::before { background: var(--prizma-drift); }
  .rect.s-off .fill { background: var(--prizma-off-course-bg); }
  .rect.s-off .fill::before { background: var(--prizma-off-course); }
  .rect:hover { filter: brightness(1.22); z-index: 5; }
  .rect.hl .fill { box-shadow: inset 0 0 0 1px var(--prizma-information); }

  .rect .lbl { position: absolute; left: 9px; right: 7px; top: 7px; pointer-events: none; }
  .rect .lbl .en { font: 600 12px/1.25 var(--font); color: var(--prizma-text-primary); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .rect .lbl .em { margin-top: 5px; font: 700 11px/1 var(--mono); color: var(--prizma-text-secondary); }
  .rect.tiny .lbl .en { -webkit-line-clamp: 1; font-size: 10.5px; }
  .rect.tiny .lbl .em { display: none; }
  .rect.nano .lbl { display: none; }

  /* tooltip */
  .tip { position: fixed; z-index: 9000; pointer-events: none; opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; max-width: 280px;
    background: var(--prizma-bg); border: 1px solid var(--prizma-border-strong); border-radius: var(--r-md); padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .tip.show { opacity: 1; transform: translateY(0); }
  .tip .tn { font: 600 13px/1.3 var(--font); color: var(--prizma-text-primary); }
  .tip .tt { margin-top: 4px; font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); letter-spacing: .3px; text-transform: uppercase; }
  .tip .tm { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .tip .tm .v { font: 800 18px/1 var(--mono); color: var(--prizma-text-primary); }
  .tip .tm .u { font-size: 11px; color: var(--prizma-text-tertiary); }
  .tip .ts { margin-top: 8px; display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--prizma-text-secondary); }
  .tip .ts .d { width: 9px; height: 9px; border-radius: 2px; flex: none; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Карта-площадь</span>
    <span class="pz-eyebrow eyebrow">Редизайн 27 · treemap</span>
    <span class="spacer"></span>
    <span class="legend">
      <span><i style="background:var(--prizma-on-course)"></i>готово</span>
      <span><i style="background:var(--prizma-information)"></i>в работе</span>
      <span><i style="background:var(--prizma-border-strong)"></i>план</span>
      <span><i style="background:var(--prizma-drift)"></i>дрейф</span>
      <span><i style="background:var(--prizma-off-course)"></i>срыв</span>
    </span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>

  <div class="wrap">
    <div class="intro">
      <span class="pz-eyebrow">Площадь = трудоёмкость</span>
      <span class="note">Каждый блок — команда; прямоугольники внутри — эпики, размер пропорционален человеко-дням. Цвет — доминирующий статус. Наведите для деталей.</span>
    </div>
    <div class="map" id="map"></div>
  </div>

  <div class="tip" id="tip"></div>

<script>
(function () {
  const D = window.PZ_DATA;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const map = document.getElementById('map');
  const tip = document.getElementById('tip');

  // ── доминирующий статус эпика ──
  // приоритет риска: off-course / drift > рабочее состояние пилюль.
  const ST = {
    done:  { cls: 's-done', lbl: 'готово',   col: 'var(--prizma-on-course)' },
    prog:  { cls: 's-prog', lbl: 'в работе', col: 'var(--prizma-information)' },
    plan:  { cls: 's-plan', lbl: 'план',     col: 'var(--prizma-border-strong)' },
    drift: { cls: 's-drift',lbl: 'дрейф',    col: 'var(--prizma-drift)' },
    off:   { cls: 's-off',  lbl: 'срыв сроков', col: 'var(--prizma-off-course)' },
  };
  function statusOf(e) {
    if (e.risk === 'off-course') return 'off';
    if (e.risk === 'drift') return 'drift';
    const total = e.pills.length || 1;
    const done = e.pills.filter(p => p.state === 'done').length;
    const prog = e.pills.filter(p => p.state === 'progress').length;
    if (done === total) return 'done';
    if (prog > 0 || (done > 0 && done < total)) return 'prog';
    return 'plan';
  }

  // ── squarified treemap ──
  // worst-aspect-ratio алгоритм (Bruls et al.) — кладёт строки в текущий
  // свободный прямоугольник, переключая ориентацию по короткой стороне.
  function worst(row, len, sum) {
    if (!row.length || len <= 0) return Infinity;
    const max = Math.max.apply(null, row), min = Math.min.apply(null, row);
    const s2 = sum * sum, l2 = len * len;
    return Math.max((l2 * max) / s2, s2 / (l2 * min));
  }
  // items: [{value, ...}] → присваивает x,y,w,h внутри rect{x,y,w,h}
  function squarify(items, rect) {
    const total = items.reduce((a, it) => a + it.value, 0) || 1;
    const area = rect.w * rect.h;
    const scaled = items.map(it => Object.assign({}, it, { area: (it.value / total) * area }));
    let free = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
    const out = [];
    let i = 0;
    while (i < scaled.length) {
      const row = [];
      let rowSum = 0;
      const short = Math.min(free.w, free.h);
      // расширяем строку пока aspect-ratio улучшается
      while (i < scaled.length) {
        const cand = row.map(r => r.area).concat(scaled[i].area);
        const candSum = rowSum + scaled[i].area;
        if (row.length && worst(cand, short, candSum) > worst(row.map(r => r.area), short, rowSum)) break;
        row.push(scaled[i]);
        rowSum = candSum;
        i++;
      }
      // раскладываем строку вдоль КОРОТКОЙ стороны (short); thick — её глубина.
      const thick = rowSum / short;
      if (free.w <= free.h) {
        // free узкий/высокий → горизонтальная полоса: ширина = short(=free.w), элементы делят её
        let ox = free.x;
        row.forEach(r => { const w = r.area / thick; out.push({ d: r, x: ox, y: free.y, w: w, h: thick }); ox += w; });
        free = { x: free.x, y: free.y + thick, w: free.w, h: free.h - thick };
      } else {
        // free широкий/низкий → вертикальная полоса: высота = short(=free.h), элементы делят её
        let oy = free.y;
        row.forEach(r => { const h = r.area / thick; out.push({ d: r, x: free.x, y: oy, w: thick, h: h }); oy += h; });
        free = { x: free.x + thick, y: free.y, w: free.w - thick, h: free.h };
      }
    }
    return out;
  }

  function render() {
    const W = map.clientWidth, H = map.clientHeight;
    if (W < 40 || H < 40) return;
    const pad = 6;
    map.innerHTML = '';

    // верхний уровень — команды, value = суммарный effort
    const teamItems = D.teams.map(team => {
      const eps = D.helpers.teamEpics(team);
      const value = eps.reduce((a, e) => a + (D.helpers.effortOf(e) || 1), 0) || 1;
      return { team, eps, value };
    }).sort((a, b) => b.value - a.value);

    const teamRects = squarify(teamItems, { x: pad, y: pad, w: W - pad * 2, h: H - pad * 2 });

    teamRects.forEach(tr => {
      const td = tr.d;
      const gx = tr.x + 2, gy = tr.y + 2, gw = Math.max(0, tr.w - 4), gh = Math.max(0, tr.h - 4);
      const grp = document.createElement('div');
      grp.className = 'grp';
      grp.style.cssText = 'left:' + gx.toFixed(1) + 'px;top:' + gy.toFixed(1) + 'px;width:' + gw.toFixed(1) + 'px;height:' + gh.toFixed(1) + 'px;';
      const totDays = td.eps.reduce((a, e) => a + D.helpers.effortOf(e), 0);
      grp.innerHTML = '<div class="grp-h"><span class="tn">' + esc(td.team) + '</span><span class="te">' + totDays + ' дн</span></div>';

      // внутри команды — эпики; оставляем 22px под заголовок
      const inner = { x: 0, y: 22, w: gw, h: Math.max(0, gh - 22) };
      const epItems = td.eps.map(e => ({ e, value: D.helpers.effortOf(e) || 1 })).sort((a, b) => b.value - a.value);
      if (inner.h > 6 && inner.w > 6) {
        const epRects = squarify(epItems, inner);
        epRects.forEach(er => {
          const e = er.d.e;
          const stKey = statusOf(e);
          const st = ST[stKey];
          const days = D.helpers.effortOf(e);
          const r = document.createElement('div');
          const area = er.w * er.h;
          const sizeCls = area < 2600 ? ' nano' : (area < 7000 ? ' tiny' : '');
          r.className = 'rect ' + st.cls + sizeCls;
          r.style.cssText = 'left:' + er.x.toFixed(1) + 'px;top:' + er.y.toFixed(1) + 'px;width:' + er.w.toFixed(1) + 'px;height:' + er.h.toFixed(1) + 'px;';
          r.dataset.epic = e.id;
          r.innerHTML = '<div class="fill"></div>' +
            '<div class="lbl"><div class="en">' + esc(e.epic) + '</div><div class="em">' + days + ' дн · ' + e.pills.length + ' раб</div></div>';
          r._tip = { nm: e.epic, team: e.team, days: days, pills: e.pills.length, st: st };
          grp.appendChild(r);
        });
      }
      map.appendChild(grp);
    });
  }

  // ── tooltip ──
  function showTip(r, ev) {
    const t = r._tip; if (!t) return;
    tip.innerHTML = '<div class="tn">' + esc(t.nm) + '</div>' +
      '<div class="tt">' + esc(t.team) + '</div>' +
      '<div class="tm"><span class="v">' + t.days + '</span><span class="u">человеко-дней · ' + t.pills + ' работ</span></div>' +
      '<div class="ts"><span class="d" style="background:' + t.st.col + '"></span>' + t.st.lbl + '</div>';
    tip.classList.add('show');
    moveTip(ev);
  }
  function moveTip(ev) {
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = ev.clientY - h - pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  map.addEventListener('mouseover', e => { const r = e.target.closest('.rect'); if (r) { r.classList.add('hl'); showTip(r, e); } });
  map.addEventListener('mousemove', e => { if (tip.classList.contains('show')) moveTip(e); });
  map.addEventListener('mouseout', e => { const r = e.target.closest('.rect'); if (r) { r.classList.remove('hl'); tip.classList.remove('show'); } });

  // синхронно + страховка + resize (GOTCHA a)
  render();
  setTimeout(render, 60);
  window.addEventListener('resize', render);

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 08 · Поток карточек</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .eyebrow { margin-left: 2px; }
  .top .spacer { flex: 1; }
  .top .legend { display: flex; gap: 14px; font-size: 11px; color: var(--prizma-text-tertiary); }
  .top .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  /* ── board ── */
  .board { flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; gap: 14px; padding: 16px 22px; align-items: stretch; }
  .col { flex: 0 0 268px; display: flex; flex-direction: column; min-height: 0; border-radius: var(--r-lg); background: color-mix(in srgb, var(--prizma-text-primary) 2%, transparent); border: 1px solid var(--prizma-border); transition: box-shadow .15s, border-color .15s; }
  .col.bz { background: transparent; border-style: dashed; }
  .col.over { border-color: var(--prizma-information); box-shadow: inset 0 0 0 1px var(--prizma-information); }
  .col.cur .ch-rel { color: var(--prizma-text-primary); }

  .ch { padding: 13px 14px 11px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .ch-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ch-rel { font: 300 19px/1 var(--mono); color: var(--prizma-text-secondary); letter-spacing: -.01em; }
  .ch-cnt { font: 600 11px/1 var(--mono); color: var(--prizma-text-tertiary); display: inline-flex; align-items: center; gap: 5px; }
  .ch-cnt .bar { display: inline-block; width: 26px; height: 4px; border-radius: 2px; background: var(--prizma-bg-tertiary); position: relative; overflow: hidden; }
  .ch-cnt .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--prizma-text-secondary); border-radius: 2px; transition: width .25s var(--ease-calm); }
  .ch-dt { display: block; margin-top: 5px; font-size: 10.5px; color: var(--prizma-text-tertiary); }
  .col.cur .ch-dt { color: var(--prizma-information); }

  .stack { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; }

  /* ── card ── */
  .card { position: relative; background: var(--prizma-bg-elevated); border: 1px solid var(--prizma-border); border-radius: var(--r-md); padding: 11px 12px 10px 13px; cursor: grab; user-select: none; transition: transform .12s var(--ease-calm), box-shadow .15s, border-color .15s, opacity .12s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--prizma-border-strong); border-radius: var(--r-md) 0 0 var(--r-md); }
  .card.r-drift::before { background: var(--prizma-drift); width: 3px; }
  .card.r-off::before { background: var(--prizma-off-course); width: 3px; }
  .card:hover { border-color: var(--prizma-border-strong); }
  .card.dragging { opacity: .4; cursor: grabbing; box-shadow: 0 8px 24px rgba(0,0,0,.45); transform: scale(.98); }

  .card-hd { display: flex; align-items: flex-start; gap: 8px; }
  .mono { flex: none; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font: 700 9.5px/1 var(--mono); letter-spacing: .4px; text-transform: uppercase; border: 1px solid var(--prizma-border-strong); border-radius: var(--r-sm); color: var(--prizma-text-secondary); }
  .card-nm { font-size: 12.5px; font-weight: 600; line-height: 1.3; flex: 1; }
  .risk { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .risk.drift { background: var(--prizma-drift); }
  .risk.off { background: var(--prizma-off-course); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .wtchip { position: relative; display: inline-flex; align-items: center; padding: 3px 7px 3px 9px; font: 600 9.5px/1 var(--mono); letter-spacing: .3px; color: var(--prizma-text-secondary); background: var(--prizma-bg-tertiary); border-radius: var(--r-sm); }
  .wtchip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--wt); border-radius: var(--r-sm) 0 0 var(--r-sm); }
  .wtchip.done { opacity: .5; text-decoration: line-through; text-decoration-color: var(--prizma-text-tertiary); }
  .wtchip.unplanned { border: 1px dashed var(--prizma-border-strong); background: transparent; }

  .card-ft { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .eff { font: 600 11px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .team-nm { font-size: 10px; color: var(--prizma-text-tertiary); }

  .drop-line { height: 2px; background: var(--prizma-information); border-radius: 2px; margin: -3px 0; opacity: 0; transition: opacity .1s; }
  .drop-line.show { opacity: .9; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Поток карточек</span>
    <span class="pz-eyebrow eyebrow">Редизайн 08 · kanban</span>
    <span class="spacer"></span>
    <span class="legend"><span><i style="background:var(--prizma-drift)"></i>дрейф</span><span><i style="background:var(--prizma-off-course)"></i>риск срыва</span></span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>
  <div class="board" id="board"></div>

<script>
(function () {
  const D = window.PZ_DATA, cols = D.releases;
  const board = document.getElementById('board');
  const wtVar = wt => 'var(' + ({BE:'--wt-be',FE:'--wt-fe',QA:'--wt-qa',AN:'--wt-an',BA:'--wt-ba',IMPL:'--wt-impl',MIG:'--wt-mig',STAB:'--wt-stab',HF:'--wt-hf'}[wt] || '--prizma-information') + ')';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // placement = доминирующий релиз (где больше всего пилюль эпика).
  function dominantCol(epic) {
    const tally = {};
    epic.pills.forEach(p => { tally[p.col] = (tally[p.col] || 0) + 1; });
    let best = epic.pills[0] ? epic.pills[0].col : 'backlog', n = -1;
    cols.forEach(c => { if ((tally[c.key] || 0) > n) { n = tally[c.key] || 0; best = c.key; } });
    return best;
  }

  // рабочее состояние: epicId → колонка размещения
  const place = {};
  D.epics.forEach(e => { place[e.id] = dominantCol(e); });

  function maxLoad() {
    let m = 1;
    cols.forEach(c => { const n = D.epics.filter(e => place[e.id] === c.key).length; if (n > m) m = n; });
    return m;
  }

  function cardHtml(e) {
    const riskCls = e.risk === 'off-course' ? 'r-off' : (e.risk === 'drift' ? 'r-drift' : '');
    const riskDot = e.risk === 'off-course' ? '<span class="risk off" title="риск срыва"></span>'
                  : e.risk === 'drift' ? '<span class="risk drift" title="дрейф"></span>' : '';
    const eff = D.helpers.effortOf(e);
    const chips = e.pills.map(p => {
      const st = p.state === 'done' ? ' done' : (p.state === 'unplanned' ? ' unplanned' : '');
      return '<span class="wtchip' + st + '" style="--wt:' + wtVar(p.wt) + '" title="' + esc(D.WT[p.wt] ? D.WT[p.wt].label : p.wt) + (p.who ? ' · ' + esc(p.who) : '') + '">' + esc(p.wt) + '</span>';
    }).join('');
    return '<div class="card ' + riskCls + '" draggable="true" data-epic="' + e.id + '">' +
      '<div class="card-hd"><span class="mono" title="' + esc(e.team) + '">' + esc(e.team.slice(0, 2)) + '</span>' +
      '<span class="card-nm">' + esc(e.epic) + '</span>' + riskDot + '</div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="card-ft"><span class="team-nm">' + esc(e.team) + '</span><span class="eff pz-mono">' + eff + ' дн</span></div>' +
      '</div>';
  }

  function render() {
    const mx = maxLoad();
    let html = '';
    cols.forEach(c => {
      const bz = !c.dated;
      const eps = D.epics.filter(e => place[e.id] === c.key);
      const dt = c.dated ? new Date(c.start).toLocaleDateString('ru',{day:'2-digit',month:'short'}) + ' – ' + new Date(c.end).toLocaleDateString('ru',{day:'2-digit',month:'short'}) : 'без даты';
      const pct = Math.round((eps.length / mx) * 100);
      html += '<div class="col' + (bz ? ' bz' : '') + (c.current ? ' cur' : '') + '" data-col="' + c.key + '">' +
        '<div class="ch"><div class="ch-top"><span class="ch-rel">' + esc(c.short) + '</span>' +
        '<span class="ch-cnt" title="карточек в окне"><span class="bar"><i style="width:' + pct + '%"></i></span><span class="num">' + eps.length + '</span></span></div>' +
        '<span class="ch-dt">' + dt + '</span></div>' +
        '<div class="stack" data-col="' + c.key + '">' + eps.map(cardHtml).join('') + '</div></div>';
    });
    board.innerHTML = html;
    wire();
  }

  let drag = null;
  function wire() {
    board.querySelectorAll('.card').forEach(card => {
      card.addEventListener('dragstart', e => {
        drag = card.dataset.epic;
        card.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag); } catch(_){}
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        board.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
        drag = null;
      });
    });
    board.querySelectorAll('.col').forEach(col => {
      col.addEventListener('dragover', e => {
        if (!drag) return;
        e.preventDefault();
        try { e.dataTransfer.dropEffect = 'move'; } catch(_){}
        col.classList.add('over');
      });
      col.addEventListener('dragleave', e => {
        if (!col.contains(e.relatedTarget)) col.classList.remove('over');
      });
      col.addEventListener('drop', e => {
        if (!drag) return;
        e.preventDefault();
        const to = col.dataset.col;
        if (place[drag] !== to) { place[drag] = to; render(); }
        else col.classList.remove('over');
      });
    });
    // edge-autoscroll по горизонтали при перетаскивании к краю
    board.addEventListener('dragover', e => {
      const r = board.getBoundingClientRect();
      if (e.clientX > r.right - 70) board.scrollLeft += 14;
      else if (e.clientX < r.left + 70) board.scrollLeft -= 14;
    }, { passive: true });
  }

  // синхронно + страховка (не полагаемся только на rAF)
  render();
  setTimeout(render, 60);
  window.addEventListener('resize', () => {}); // layout стабилен; render не зависит от измерений

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

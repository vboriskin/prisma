<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн 28 · Конвейер этапов</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/sample-data.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── topbar ── */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--prizma-border); flex: none; }
  .top .mark { width: 18px; height: 18px; color: var(--prizma-mark); }
  .top .title { font-weight: 700; font-size: 14px; }
  .top .eyebrow { margin-left: 2px; }
  .top .spacer { flex: 1; }
  .top .legend { display: flex; gap: 13px; font-size: 11px; color: var(--prizma-text-tertiary); align-items: center; }
  .top .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  /* ── pipeline board ── */
  .board { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 0; padding: 16px 22px 18px; }

  .stage { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* стрелка-связка между этапами */
  .arrow { flex: none; width: 30px; display: flex; align-items: center; justify-content: center; color: var(--prizma-border-strong); }
  .arrow svg { width: 18px; height: 18px; }

  .st-h { flex: none; padding: 0 4px 12px; }
  .st-top { display: flex; align-items: center; gap: 8px; }
  .st-idx { width: 19px; height: 19px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--prizma-border-strong); border-radius: 50%; font: 700 10px/1 var(--mono); color: var(--prizma-text-tertiary); }
  .st-nm { font: 700 13px/1 var(--font); letter-spacing: -.01em; }
  .st-cnt { margin-left: auto; font: 700 13px/1 var(--mono); color: var(--prizma-text-secondary); }
  .st-cnt small { font-size: 9px; font-weight: 600; color: var(--prizma-text-tertiary); margin-left: 3px; }
  .st-wip { margin-top: 8px; height: 3px; border-radius: 2px; background: var(--prizma-bg-tertiary); overflow: hidden; }
  .st-wip i { display: block; height: 100%; background: var(--prizma-text-tertiary); border-radius: 2px; transition: width .3s var(--ease-calm); }
  .st-rel .st-wip i { background: var(--prizma-on-course); }

  .lane { flex: 1; min-height: 0; overflow-y: auto; padding: 3px 4px 10px; display: flex; flex-direction: column; gap: 9px; }
  .lane.drop { background: color-mix(in srgb, var(--prizma-information) 7%, transparent); border-radius: var(--r-md); outline: 1px dashed var(--prizma-information); }

  /* ── card ── */
  .card { position: relative; background: var(--prizma-bg-elevated); border: 1px solid var(--prizma-border); border-radius: var(--r-md); padding: 10px 12px 11px 13px; transition: border-color .15s, transform .12s var(--ease-calm), opacity .12s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--prizma-border-strong); border-radius: var(--r-md) 0 0 var(--r-md); }
  .card.r-drift::before { background: var(--prizma-drift); width: 3px; }
  .card.r-off::before { background: var(--prizma-off-course); width: 3px; }
  .card:hover { border-color: var(--prizma-border-strong); }
  .card.done { opacity: .82; }

  .c-hd { display: flex; align-items: flex-start; gap: 8px; }
  .c-team { flex: none; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font: 700 9.5px/1 var(--mono); letter-spacing: .4px; text-transform: uppercase; border: 1px solid var(--prizma-border-strong); border-radius: var(--r-sm); color: var(--prizma-text-secondary); }
  .c-nm { flex: 1; font: 600 12.5px/1.3 var(--font); }
  .c-risk { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .c-risk.drift { background: var(--prizma-drift); }
  .c-risk.off { background: var(--prizma-off-course); }

  .c-ft { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
  .c-prog { flex: 1; height: 4px; border-radius: 2px; background: var(--prizma-bg-tertiary); overflow: hidden; }
  .c-prog i { display: block; height: 100%; border-radius: 2px; background: var(--prizma-text-secondary); transition: width .3s var(--ease-calm); }
  .card.done .c-prog i { background: var(--prizma-on-course); }
  .c-pct { font: 700 10.5px/1 var(--mono); color: var(--prizma-text-tertiary); flex: none; min-width: 30px; text-align: right; }
  .c-days { font: 600 10px/1 var(--mono); color: var(--prizma-text-tertiary); flex: none; }

  .empty { padding: 14px 6px; font-size: 11px; color: var(--prizma-text-tertiary); text-align: center; opacity: .7; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L4 19h16L12 2z"/><path d="M12 2v17" opacity=".4"/></svg>
    <span class="title">Конвейер этапов</span>
    <span class="pz-eyebrow eyebrow">Редизайн 28 · pipeline</span>
    <span class="spacer"></span>
    <span class="legend">
      <span><i style="background:var(--prizma-drift)"></i>дрейф</span>
      <span><i style="background:var(--prizma-off-course)"></i>срыв</span>
      <span><i style="background:var(--prizma-on-course)"></i>готово</span>
    </span>
    <button class="pz-btn pz-btn-icon" id="tt" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>

  <div class="board" id="board"></div>

<script>
(function () {
  const D = window.PZ_DATA;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const board = document.getElementById('board');

  // ── этапы жизненного цикла ──
  // каждый эпик попадает в текущий этап по составу/состоянию пилюль.
  const STAGES = [
    { key: 'an',   name: 'Аналитика',     wts: ['AN', 'BA'] },
    { key: 'dev',  name: 'Разработка',    wts: ['BE', 'FE', 'IMPL', 'MIG'] },
    { key: 'qa',   name: 'Тестирование',  wts: ['QA', 'STAB', 'HF'] },
    { key: 'rel',  name: 'Релиз',         wts: [] },
  ];
  const stageOf = {}; STAGES.forEach((s, i) => stageOf[s.key] = i);
  const wtStage = {}; STAGES.forEach(s => s.wts.forEach(w => wtStage[w] = s.key));

  // Определение текущего этапа эпика:
  //  • все пилюли done → «Релиз».
  //  • иначе берём самый ранний этап, где есть НЕзавершённая работа
  //    (узкое место конвейера). Так аналитика-в-работе держит эпик
  //    в «Аналитике», даже если у разработки уже есть запланированные пилюли.
  function deriveStage(e) {
    const allDone = e.pills.length > 0 && e.pills.every(p => p.state === 'done');
    if (allDone) return 'rel';
    let earliest = STAGES.length - 1; // по умолчанию — релиз
    e.pills.forEach(p => {
      if (p.state === 'done') return;
      const sk = wtStage[p.wt];
      if (sk == null) return;
      const idx = stageOf[sk];
      if (idx < earliest) earliest = idx;
    });
    return STAGES[earliest].key;
  }

  // рабочее состояние: epicId → этап (draggable между колонками)
  const place = {};
  D.epics.forEach(e => { place[e.id] = deriveStage(e); });

  function cardHtml(e) {
    const riskCls = e.risk === 'off-course' ? 'r-off' : (e.risk === 'drift' ? 'r-drift' : '');
    const riskDot = e.risk === 'off-course' ? '<span class="c-risk off" title="риск срыва"></span>'
                  : e.risk === 'drift' ? '<span class="c-risk drift" title="дрейф"></span>' : '';
    const ratio = D.helpers.doneRatio(e);
    const pct = Math.round(ratio * 100);
    const days = D.helpers.effortOf(e);
    const doneCls = pct === 100 ? ' done' : '';
    return '<div class="card ' + riskCls + doneCls + '" draggable="true" data-epic="' + e.id + '">' +
      '<div class="c-hd"><span class="c-team" title="' + esc(e.team) + '">' + esc(e.team.slice(0, 2)) + '</span>' +
      '<span class="c-nm">' + esc(e.epic) + '</span>' + riskDot + '</div>' +
      '<div class="c-ft"><span class="c-days pz-mono">' + days + ' дн</span>' +
      '<span class="c-prog"><i style="width:' + pct + '%"></i></span>' +
      '<span class="c-pct">' + pct + '%</span></div>' +
      '</div>';
  }

  const arrowSvg = '<div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12 6l6 6-6 6"/></svg></div>';

  function render() {
    let html = '';
    STAGES.forEach((s, i) => {
      const eps = D.epics.filter(e => place[e.id] === s.key);
      // WIP = активные (есть прогресс или частичная готовность), не считая полностью готовых
      const wip = eps.filter(e => { const r = D.helpers.doneRatio(e); return r > 0 && r < 1 || e.pills.some(p => p.state === 'progress'); }).length;
      const wipPct = eps.length ? Math.round(wip / eps.length * 100) : 0;
      const body = eps.length ? eps.map(cardHtml).join('') : '<div class="empty">пусто</div>';
      html += '<div class="stage' + (s.key === 'rel' ? ' st-rel' : '') + '" data-stage="' + s.key + '">' +
        '<div class="st-h"><div class="st-top"><span class="st-idx">' + (i + 1) + '</span>' +
        '<span class="st-nm">' + esc(s.name) + '</span>' +
        '<span class="st-cnt">' + eps.length + '<small>ЭП</small></span></div>' +
        '<div class="st-wip" title="' + (s.key === 'rel' ? 'готово к релизу' : 'в работе: ' + wip) + '"><i style="width:' + (s.key === 'rel' ? 100 : wipPct) + '%"></i></div></div>' +
        '<div class="lane" data-stage="' + s.key + '">' + body + '</div></div>';
      if (i < STAGES.length - 1) html += arrowSvg;
    });
    board.innerHTML = html;
    wire();
  }

  // ── drag&drop между этапами ──
  let drag = null;
  function wire() {
    board.querySelectorAll('.card').forEach(card => {
      card.addEventListener('dragstart', e => {
        drag = card.dataset.epic;
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag); } catch (_) {}
        setTimeout(() => card.style.opacity = '.35', 0);
      });
      card.addEventListener('dragend', () => { card.style.opacity = ''; board.querySelectorAll('.lane').forEach(l => l.classList.remove('drop')); drag = null; });
    });
    board.querySelectorAll('.lane').forEach(lane => {
      lane.addEventListener('dragover', e => { if (!drag) return; e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch (_) {} lane.classList.add('drop'); });
      lane.addEventListener('dragleave', e => { if (!lane.contains(e.relatedTarget)) lane.classList.remove('drop'); });
      lane.addEventListener('drop', e => {
        if (!drag) return; e.preventDefault();
        const to = lane.dataset.stage;
        if (place[drag] !== to) { place[drag] = to; render(); }
        else lane.classList.remove('drop');
      });
    });
  }

  // синхронно + страховка (layout не зависит от измерений)
  render();
  setTimeout(render, 60);

  document.getElementById('tt').addEventListener('click', () => {
    const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

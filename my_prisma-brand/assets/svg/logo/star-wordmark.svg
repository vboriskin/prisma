<?xml version="1.0" encoding="UTF-8"?>
<!--
  Призма — звезда + wordmark (горизонтальный)

  Для лендингов, подписей, hero-блоков.
  Использует currentColor.

  Wordmark: кириллица «Призма», SF Pro Display 36px weight 200,
  letter-spacing 6px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Призма">
  <title>Призма</title>
  <g fill="currentColor">
    <!-- Звезда, масштабированная под высоту -->
    <g transform="translate(40,40)">
      <polygon points="0,-32 2.5,-2.5 0,0 -2.5,-2.5"/>
      <polygon points="0,32 2.5,2.5 0,0 -2.5,2.5"/>
      <polygon points="-32,0 -2.5,-2.5 0,0 -2.5,2.5" opacity="0.7"/>
      <polygon points="32,0 2.5,-2.5 0,0 2.5,2.5" opacity="0.7"/>
      <polygon points="-21,-21 -2,-3.2 0,0 -3.2,-2" opacity="0.45"/>
      <polygon points="21,-21 2,-3.2 0,0 3.2,-2" opacity="0.45"/>
      <polygon points="-21,21 -2,3.2 0,0 -3.2,2" opacity="0.45"/>
      <polygon points="21,21 2,3.2 0,0 3.2,2" opacity="0.45"/>
      <circle r="2.5"/>
    </g>
    <!-- Wordmark — Призма -->
    <text x="100" y="52"
          font-family="-apple-system, 'SF Pro Display', sans-serif"
          font-size="36"
          font-weight="200"
          letter-spacing="6">Призма</text>
  </g>
</svg>

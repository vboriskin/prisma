<?xml version="1.0" encoding="UTF-8"?>
<!--
  Призма — Иконка модуля: Команда
  Люди в команде. Центральная звезда + 3 спутника.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Команда">
  <title>Команда</title>
  <g transform="translate(12,12)" fill="currentColor">
    <!-- Центральная звезда -->
    <polygon points="0,-6.5 0.5,-0.5 0,0 -0.5,-0.5"/>
    <polygon points="0,6.5 0.5,0.5 0,0 -0.5,0.5" opacity="0.5"/>
    <polygon points="-6.5,0 -0.5,-0.5 0,0 -0.5,0.5" opacity="0.5"/>
    <polygon points="6.5,0 0.5,-0.5 0,0 0.5,0.5" opacity="0.5"/>
    <circle r="0.6"/>
    <!-- Звёзды-спутники -->
    <g transform="translate(-7.5,-5)">
      <polygon points="0,-1.4 0.15,-0.15 0,0 -0.15,-0.15" opacity="0.7"/>
      <polygon points="0,1.4 0.15,0.15 0,0 -0.15,0.15" opacity="0.7"/>
      <polygon points="-1.4,0 -0.15,-0.15 0,0 -0.15,0.15" opacity="0.5"/>
      <polygon points="1.4,0 0.15,-0.15 0,0 0.15,0.15" opacity="0.5"/>
    </g>
    <g transform="translate(7.5,-5)">
      <polygon points="0,-1.4 0.15,-0.15 0,0 -0.15,-0.15" opacity="0.7"/>
      <polygon points="0,1.4 0.15,0.15 0,0 -0.15,0.15" opacity="0.7"/>
      <polygon points="-1.4,0 -0.15,-0.15 0,0 -0.15,0.15" opacity="0.5"/>
      <polygon points="1.4,0 0.15,-0.15 0,0 0.15,0.15" opacity="0.5"/>
    </g>
    <g transform="translate(0,8)">
      <polygon points="0,-1.4 0.15,-0.15 0,0 -0.15,-0.15" opacity="0.7"/>
      <polygon points="0,1.4 0.15,0.15 0,0 -0.15,0.15" opacity="0.7"/>
      <polygon points="-1.4,0 -0.15,-0.15 0,0 -0.15,0.15" opacity="0.5"/>
      <polygon points="1.4,0 0.15,-0.15 0,0 0.15,0.15" opacity="0.5"/>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Призма — Иконка модуля: Цели
  Цели и метрики. Звезда внутри концентрических кругов (мишень).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Цели">
  <title>Цели</title>
  <g transform="translate(12,12)">
    <!-- Концентрические круги -->
    <circle r="9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.2"/>
    <circle r="6" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3"/>
    <!-- Звезда -->
    <g fill="currentColor">
      <polygon points="0,-9 0.7,-0.7 0,0 -0.7,-0.7"/>
      <polygon points="0,9 0.7,0.7 0,0 -0.7,0.7" opacity="0.5"/>
      <polygon points="-9,0 -0.7,-0.7 0,0 -0.7,0.7" opacity="0.5"/>
      <polygon points="9,0 0.7,-0.7 0,0 0.7,0.7" opacity="0.5"/>
      <circle r="0.7"/>
    </g>
  </g>
</svg>
